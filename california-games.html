<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  canvas {
    border: 3px solid #ff6600;
    box-shadow: 0 0 30px #ff660066;
    image-rendering: pixelated;
    max-width: 100vw;
    max-height: 90vh;
  }
  #ui {
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    margin-top: 6px;
    text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="c" width="640" height="400"></canvas>
<div id="ui">CALIFORNIA GAMES</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const ui = document.getElementById('ui');

// Input
const keys = {};
const keysJustPressed = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) keysJustPressed[e.code] = true;
  keys[e.code] = true;
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Audio
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type = 'square', vol = 0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freq; o.type = type;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxKick()    { beep(220, 0.1, 'square', 0.12); }
function sfxScore()   { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f,0.12,'square',0.1), i*70)); }
function sfxWipeout() { beep(180, 0.4, 'sawtooth', 0.12); }
function sfxJump()    { beep(350, 0.08, 'square', 0.1); beep(500, 0.08, 'square', 0.08); }
function sfxTick()    { beep(440, 0.04, 'square', 0.06); }

// State
let state = 'menu';
const highScores = { hackySack: 0, halfpipe: 0, surfing: 0, bmx: 0, frisbee: 0 };

// ─── MENU ──────────────────────────────────────────────────────────────────
let menuSel = 0;
let menuTick = 0;
const SPORTS = [
  { key: 'hackySack', label: 'HACKY SACK',  color: '#00ff88', ctrl: '← → MOVE  SPACE KICK' },
  { key: 'halfpipe',  label: 'HALF-PIPE',   color: '#ff6600', ctrl: '↓ PUMP at bottom  A/S/D/W TRICKS at ramp top' },
  { key: 'surfing',   label: 'SURFING',     color: '#44aaff', ctrl: '↑↓←→ RIDE WAVE  A/S/D/W TRICKS' },
  { key: 'bmx',       label: 'BMX',         color: '#ff44aa', ctrl: 'SPACE JUMP  A/S/D/W TRICKS in air' },
  { key: 'frisbee',   label: 'FRISBEE',     color: '#ffff00', ctrl: '↑↓ ANGLE  Watch power bar  SPACE THROW' },
];

function updateMenu() {
  menuTick++;
  if (keysJustPressed['ArrowUp'])   { menuSel = (menuSel - 1 + SPORTS.length) % SPORTS.length; sfxTick(); }
  if (keysJustPressed['ArrowDown']) { menuSel = (menuSel + 1) % SPORTS.length; sfxTick(); }
  if (keysJustPressed['Enter'] || keysJustPressed['Space']) {
    state = SPORTS[menuSel].key;
    initGame(state);
    sfxScore();
  }
}

function drawMenu() {
  // Retro sunset sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d0033');
  sky.addColorStop(0.45, '#3d0066');
  sky.addColorStop(0.75, '#cc3300');
  sky.addColorStop(1, '#ff8800');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Retro sun with horizontal stripes
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath(); ctx.arc(W/2, H*0.52, 70, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ff8800';
  for (let i = 0; i < 7; i++) {
    const sy = H*0.52 - 60 + i * 18 + (menuTick % 36 < 18 ? 0 : 9);
    const hw = Math.sqrt(Math.max(0, 70*70 - (sy - H*0.52)**2));
    if (hw > 0) ctx.fillRect(W/2 - hw, sy, hw*2, 10);
  }

  // Ocean horizon
  ctx.fillStyle = '#001133';
  ctx.fillRect(0, H*0.52, W, H*0.08);

  // Grid floor (retro perspective)
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const y = H*0.6 + t * H*0.4;
    const alpha = t * 0.6;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = -6; i <= 6; i++) {
    ctx.beginPath();
    ctx.moveTo(W/2 + i * 60, H*0.6);
    ctx.lineTo(W/2 + i * 300, H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Ground fill
  ctx.fillStyle = '#1a0033';
  ctx.fillRect(0, H*0.6, W, H*0.4);

  // Title — dual shadow chrome effect
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px "Courier New"';
  ctx.fillStyle = '#ff0088'; ctx.fillText('CALIFORNIA', W/2 + 4, 66);
  ctx.fillStyle = '#00ffff'; ctx.fillText('CALIFORNIA', W/2 - 2, 62);
  ctx.fillStyle = '#ffffff'; ctx.fillText('CALIFORNIA', W/2, 60);

  ctx.font = 'bold 40px "Courier New"';
  ctx.fillStyle = '#ff6600'; ctx.fillText('G A M E S', W/2 + 4, 106);
  ctx.fillStyle = '#ffff00'; ctx.fillText('G A M E S', W/2, 102);

  // Sport list
  SPORTS.forEach((s, i) => {
    const y = 160 + i * 42;
    const sel = i === menuSel;
    if (sel) {
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(W/2 - 140, y - 22, 280, 30);
    }
    ctx.font = sel ? 'bold 22px "Courier New"' : '18px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillStyle = sel ? '#ffffff' : s.color;
    ctx.fillText(sel ? '> ' + s.label + ' <' : s.label, W/2, y);
    if (sel) {
      ctx.font = '11px "Courier New"';
      ctx.fillStyle = '#aaaaaa';
      ctx.fillText(s.ctrl, W/2, y + 16);
    }
    const hs = highScores[s.key];
    if (hs > 0 && !sel) {
      ctx.font = '11px "Courier New"';
      ctx.fillStyle = '#555';
      ctx.fillText('BEST: ' + hs, W/2, y + 15);
    }
  });

  ctx.font = '13px "Courier New"';
  ctx.fillStyle = '#ffffff88';
  ctx.fillText('↑ ↓  SELECT       ENTER / SPACE  START', W/2, H - 12);
}

// ─── HACKY SACK ────────────────────────────────────────────────────────────
let hk = {};
function initHackySack() {
  hk = {
    px: W/2, py: H - 78,
    bx: W/2, by: H - 130,
    bvx: 1.8, bvy: -4,
    score: 0, kicks: 0, combo: 0,
    timer: 45, timerFrac: 0,
    kickCD: 0,
    trickTimer: 0, trickText: '', trickPts: 0,
    phase: 'play',
    bgOff: 0,
  };
}

function updateHackySack(dt) {
  if (hk.phase === 'end') { if (keysJustPressed['Enter']) state = 'menu'; return; }

  hk.timerFrac += dt;
  if (hk.timerFrac >= 1) {
    hk.timerFrac -= 1; hk.timer--;
    if (hk.timer <= 0) {
      hk.phase = 'end';
      if (hk.score > highScores.hackySack) highScores.hackySack = hk.score;
      sfxScore(); return;
    }
  }
  hk.bgOff += 0.4;
  if (hk.kickCD > 0) hk.kickCD -= dt;
  if (hk.trickTimer > 0) hk.trickTimer -= dt;

  // Player move
  if (keys['ArrowLeft'])  hk.px = Math.max(30, hk.px - 4);
  if (keys['ArrowRight']) hk.px = Math.min(W - 30, hk.px + 4);
  // Space snaps player toward ball
  if (keys['Space']) hk.px += (hk.bx - hk.px) * 0.12;

  // Ball physics
  hk.bvy += 0.2;
  hk.bx += hk.bvx;
  hk.by += hk.bvy;
  if (hk.bx < 10)     { hk.bx = 10;     hk.bvx =  Math.abs(hk.bvx); }
  if (hk.bx > W - 10) { hk.bx = W - 10; hk.bvx = -Math.abs(hk.bvx); }
  if (hk.by > H - 42) {
    hk.by = H - 42; hk.bvy = -5 - Math.random(); hk.combo = 0; sfxWipeout();
  }

  // Kick detection
  const dx = hk.bx - hk.px, dy = hk.by - (hk.py - 18);
  if (Math.sqrt(dx*dx + dy*dy) < 38 && hk.kickCD <= 0 && hk.bvy > -1) {
    hk.kickCD = 0.28;
    hk.bvx = (dx * 0.3) + (Math.random() - 0.5) * 2;
    hk.bvy = -(7 + Math.random() * 2);
    hk.kicks++; hk.combo++;
    const tricks = ['KICK!','DOUBLE!','TRIPLE!','QUAD!','KNEE!','HEADER!','SICK!','GNARLY!','RADICAL!'];
    hk.trickText = tricks[Math.min(hk.combo - 1, tricks.length - 1)];
    hk.trickPts  = hk.combo * 10;
    hk.score    += hk.trickPts;
    hk.trickTimer = 1.4;
    sfxKick();
  }
}

function drawHackySack() {
  // Beach sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#5bc8f5'); sky.addColorStop(0.55, '#ffe680'); sky.addColorStop(1, '#f4d03f');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  [[0,70,40],[220,50,30],[430,85,35]].forEach(([ox,y,r]) => {
    const cx = ((hk.bgOff * 0.25 + ox) % (W + 100)) - 50;
    [0,22,44].forEach((d,i) => { ctx.beginPath(); ctx.arc(cx+d, y-[0,8,2][i], r-i*4, 0, Math.PI*2); ctx.fill(); });
  });

  // Ocean strip
  ctx.fillStyle = '#1a7fbf'; ctx.fillRect(0, H*0.56, W, H*0.1);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  for (let w = 0; w < 3; w++) {
    ctx.beginPath();
    for (let x = 0; x < W; x += 4) {
      const y = H*0.58 + w*10 + Math.sin((x + hk.bgOff*2 + w*50)*0.05) * 5;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // Sand
  const sand = ctx.createLinearGradient(0, H*0.66, 0, H);
  sand.addColorStop(0, '#f5d060'); sand.addColorStop(1, '#c9a93a');
  ctx.fillStyle = sand; ctx.fillRect(0, H*0.66, W, H*0.34);

  // Palm tree
  ctx.fillStyle = '#7a4010';
  ctx.fillRect(W-74, H*0.33, 11, H*0.34);
  ctx.fillStyle = '#2d7a1a';
  [[W-68,H*0.34,42],[W-80,H*0.31,32],[W-56,H*0.31,28]].forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#ffcc00';
  [[W-62,H*0.38],[W-74,H*0.39],[W-68,H*0.36]].forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
  });

  // Ground line
  ctx.fillStyle = '#b8940a'; ctx.fillRect(0, H-32, W, 32);

  // Player shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(hk.px, hk.py+6, 22, 5, 0, 0, Math.PI*2); ctx.fill();

  // Player stick figure
  const kickPose = hk.kickCD > 0.15;
  ctx.strokeStyle = '#cc2200'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(hk.px, hk.py-50, 12, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hk.px, hk.py-38); ctx.lineTo(hk.px, hk.py-10);
  ctx.moveTo(hk.px-18, hk.py-26); ctx.lineTo(hk.px, hk.py-30); ctx.lineTo(hk.px+18, hk.py-26);
  ctx.moveTo(hk.px, hk.py-10); ctx.lineTo(hk.px-12, hk.py+6); ctx.lineTo(hk.px-14, hk.py+22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hk.px, hk.py-10);
  if (kickPose) {
    ctx.lineTo(hk.px+22, hk.py-25);
  } else {
    ctx.lineTo(hk.px+12, hk.py+6); ctx.lineTo(hk.px+14, hk.py+22);
  }
  ctx.stroke();

  // Hacky sack
  ctx.fillStyle = '#ff3300';
  ctx.beginPath(); ctx.arc(hk.bx, hk.by, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff8800';
  ctx.beginPath(); ctx.arc(hk.bx-2, hk.by-2, 4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#880000'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(hk.bx, hk.by, 8, 0, Math.PI*2); ctx.stroke();

  // HUD bar
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, 38);
  ctx.font = 'bold 18px "Courier New"';
  ctx.textAlign = 'left';  ctx.fillStyle = '#00ff88'; ctx.fillText('SCORE: '+hk.score, 10, 26);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffff00'; ctx.fillText('COMBO ×'+hk.combo, W/2, 26);
  ctx.textAlign = 'right';  ctx.fillStyle = hk.timer<=10?'#ff3300':'#ffffff'; ctx.fillText('TIME: '+hk.timer, W-10, 26);

  // Trick popup
  if (hk.trickTimer > 0) {
    ctx.globalAlpha = Math.min(1, hk.trickTimer);
    ctx.font = 'bold 28px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00'; ctx.fillText(hk.trickText, W/2, H/2-28);
    ctx.font = '18px "Courier New"'; ctx.fillStyle = '#00ff88';
    ctx.fillText('+'+hk.trickPts+' pts', W/2, H/2+2);
    ctx.globalAlpha = 1;
  }

  ctx.font = '11px "Courier New"'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('← → MOVE   SPACE CHASE BALL   Walk under it to kick!', W/2, H-5);

  if (hk.phase === 'end') drawEndScreen('TIME\'S UP!', hk.score, 'KICKS: '+hk.kicks, '#00ff88', highScores.hackySack);
}

// ─── HALF-PIPE ──────────────────────────────────────────────────────────────
let hp = {};
const PIPE_LEFT = 40, PIPE_RIGHT = W - 40, PIPE_TOP = 115, PIPE_BOT = H - 55;

function pipeY(x) {
  const nx = (x - PIPE_LEFT) / (PIPE_RIGHT - PIPE_LEFT);
  return PIPE_TOP + (PIPE_BOT - PIPE_TOP) * (1 - 3.6*(nx-0.5)*(nx-0.5));
}

function initHalfpipe() {
  hp = {
    sx: W/2, sy: 0,
    svx: 3.5,
    score: 0, timer: 60, timerFrac: 0,
    phase: 'play',
    totalTricks: 0,
    trickText: '', trickTimer: 0, trickPts: 0,
    atTop: false, topSide: 0,
    doneTricks: new Set(),
    bgScroll: 0,
    wheelRot: 0,
  };
  hp.sy = pipeY(hp.sx) - 20;
}

const HP_TRICKS = {
  'KeyA': { name: 'GRIND',    pts: 200 },
  'KeyS': { name: '360 FLIP', pts: 350 },
  'KeyD': { name: 'KICKFLIP', pts: 250 },
  'KeyW': { name: 'AIR WALK', pts: 300 },
};

function updateHalfpipe(dt) {
  if (hp.phase === 'end') { if (keysJustPressed['Enter']) state = 'menu'; return; }

  hp.timerFrac += dt;
  if (hp.timerFrac >= 1) {
    hp.timerFrac -= 1; hp.timer--;
    if (hp.timer <= 0) {
      hp.phase = 'end';
      if (hp.score > highScores.halfpipe) highScores.halfpipe = hp.score;
      sfxScore(); return;
    }
  }

  hp.bgScroll += Math.abs(hp.svx) * 0.5;
  hp.wheelRot += hp.svx * 0.25;

  // Gravity from pipe slope
  const slope = (pipeY(hp.sx + 2) - pipeY(hp.sx - 2)) / 4;
  hp.svx -= slope * 0.32;
  hp.svx *= 0.993;

  // Pump at bottom (arrow down)
  const nearBottom = Math.abs(hp.sx - W/2) < 50;
  if ((keys['ArrowDown']) && nearBottom) {
    hp.svx *= 1.06;
    if (Math.abs(hp.svx) > 14) hp.svx = 14 * Math.sign(hp.svx);
  }

  hp.sx += hp.svx * 1.8;
  hp.sx = Math.max(PIPE_LEFT+2, Math.min(PIPE_RIGHT-2, hp.sx));
  if (hp.sx <= PIPE_LEFT+2)  { hp.svx =  Math.abs(hp.svx)*0.95; }
  if (hp.sx >= PIPE_RIGHT-2) { hp.svx = -Math.abs(hp.svx)*0.95; }

  hp.sy = pipeY(hp.sx) - 20;

  // Detect top of ramp
  const leftTop  = hp.sx < PIPE_LEFT  + 60;
  const rightTop = hp.sx > PIPE_RIGHT - 60;
  hp.atTop = leftTop || rightTop;
  if (!hp.atTop) hp.doneTricks.clear();

  if (hp.trickTimer > 0) hp.trickTimer -= dt;

  if (hp.atTop) {
    for (const [k, t] of Object.entries(HP_TRICKS)) {
      if (keysJustPressed[k] && !hp.doneTricks.has(t.name)) {
        hp.doneTricks.add(t.name);
        hp.trickText = t.name; hp.trickPts = t.pts;
        hp.trickTimer = 1.4;
        hp.score += t.pts; hp.totalTricks++;
        sfxScore(); break;
      }
    }
  }
}

function drawHalfpipe() {
  // Night city sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#070018'); sky.addColorStop(0.6, '#1a0035'); sky.addColorStop(1, '#320008');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 35; i++) {
    const sx = (i*73 + hp.bgScroll*0.04) % W;
    const sy = (i*47) % (PIPE_TOP - 10);
    ctx.fillRect(sx, sy, i%4===0?2:1, i%4===0?2:1);
  }

  // City silhouette
  const cityC = ['#ff00ff44','#00ffff44','#ff660044','#00ff0044'];
  for (let i = 0; i < 8; i++) {
    const bx = ((i*95 - hp.bgScroll*0.18) % (W+90)) - 45;
    const bh = 50 + (i*43)%90, bw = 55;
    ctx.fillStyle = cityC[i%4];
    ctx.fillRect(bx, PIPE_TOP - bh - 10, bw, bh);
    ctx.fillStyle = '#ffff0066';
    for (let wr = 0; wr < 3; wr++) for (let wc = 0; wc < Math.floor(bh/14); wc++) {
      if ((i+wr+wc)%3!==0) ctx.fillRect(bx+8+wr*14, PIPE_TOP-bh-6+wc*14, 8, 8);
    }
  }

  // Pipe surface
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath(); ctx.moveTo(PIPE_LEFT, PIPE_TOP);
  for (let x = PIPE_LEFT; x <= PIPE_RIGHT; x += 2) ctx.lineTo(x, pipeY(x));
  ctx.lineTo(PIPE_RIGHT, PIPE_TOP); ctx.closePath(); ctx.fill();

  // Pipe sheen
  ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(PIPE_LEFT, PIPE_TOP);
  for (let x = PIPE_LEFT; x <= PIPE_RIGHT; x += 2) ctx.lineTo(x, pipeY(x)-2);
  ctx.stroke();

  // Lane lines
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  for (let x = PIPE_LEFT+40; x < PIPE_RIGHT; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, pipeY(x)-8); ctx.lineTo(x, pipeY(x)+8); ctx.stroke();
  }

  // Top rails
  ctx.fillStyle = '#cccccc';
  ctx.fillRect(PIPE_LEFT-5, PIPE_TOP-10, 18, 10);
  ctx.fillRect(PIPE_RIGHT-13, PIPE_TOP-10, 18, 10);

  // Trick hint at top
  if (hp.atTop) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(W/2-180, H-52, 360, 22);
    ctx.font = '11px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.fillText('A=GRIND   S=360 FLIP   D=KICKFLIP   W=AIR WALK', W/2, H-36);
  }

  // Skater
  const sx = hp.sx, sy = hp.sy;
  const angle = Math.atan2(pipeY(sx+6)-pipeY(sx-6), 12);

  ctx.save(); ctx.translate(sx, sy); ctx.rotate(angle);
  // Board
  ctx.fillStyle = '#ff6600'; ctx.fillRect(-20, 14, 40, 7);
  ctx.fillStyle = '#cc3300'; ctx.fillRect(-17, 11, 34, 4);
  // Wheels
  ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
  [-13,13].forEach(wx => {
    ctx.beginPath(); ctx.arc(wx, 21, 5, 0, Math.PI*2); ctx.stroke();
    for (let s = 0; s < 4; s++) {
      const a = s*Math.PI/2 + hp.wheelRot;
      ctx.beginPath(); ctx.moveTo(wx,21); ctx.lineTo(wx+Math.cos(a)*4, 21+Math.sin(a)*4); ctx.stroke();
    }
  });
  // Rider
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-8,11); ctx.lineTo(-7,-2);
  ctx.moveTo(8,11);  ctx.lineTo(7,-2);
  ctx.moveTo(-7,-2); ctx.lineTo(0,-16); ctx.lineTo(7,-2);
  const armSpread = hp.atTop ? 22 : 14;
  ctx.moveTo(-armSpread,-6); ctx.lineTo(0,-14); ctx.lineTo(armSpread,-6);
  ctx.stroke();
  ctx.fillStyle = '#ffcc88';
  ctx.beginPath(); ctx.arc(0,-24, 8, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,38);
  ctx.font = 'bold 18px "Courier New"';
  ctx.textAlign = 'left';  ctx.fillStyle = '#00ffff'; ctx.fillText('SCORE: '+hp.score, 10, 26);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ff00ff'; ctx.fillText('TRICKS: '+hp.totalTricks, W/2, 26);
  ctx.textAlign = 'right';  ctx.fillStyle = hp.timer<=10?'#ff3300':'#fff'; ctx.fillText('TIME: '+hp.timer, W-10, 26);

  if (hp.trickTimer > 0) {
    ctx.globalAlpha = Math.min(1, hp.trickTimer);
    ctx.font = 'bold 28px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00'; ctx.fillText(hp.trickText+'!', W/2, H/2-20);
    ctx.font = '18px "Courier New"'; ctx.fillStyle = '#00ff88';
    ctx.fillText('+'+hp.trickPts+' pts', W/2, H/2+10);
    ctx.globalAlpha = 1;
  }

  ctx.font = '11px "Courier New"'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('↓ PUMP at bottom for speed   |   ESC = Menu', W/2, H-6);

  if (hp.phase === 'end') drawEndScreen('SESSION OVER!', hp.score, 'TRICKS: '+hp.totalTricks, '#00ffff', highScores.halfpipe);
}

// ─── SURFING ────────────────────────────────────────────────────────────────
let sf = {};
function initSurfing() {
  sf = {
    sx: 160, sy: H/2,
    angle: 0,
    score: 0, timer: 60, timerFrac: 0,
    phase: 'play',
    waveTime: 0, waveY: H/2,
    wipeout: false, wipeoutTimer: 0,
    trickTimer: 0, trickText: '', trickPts: 0, combo: 0,
    bgOff: 0, speed: 3,
    dolphins: [{x:W+80,y:H/2,ph:0},{x:W+260,y:H/2+20,ph:1.5}],
    birds: [{x:80,y:90,ph:0},{x:260,y:70,ph:0.7},{x:450,y:110,ph:1.4}],
  };
}

const SURF_TRICKS = {
  'KeyA': { name: 'CUTBACK',   pts: 150 },
  'KeyS': { name: 'TUBE RIDE', pts: 300 },
  'KeyD': { name: 'HANG TEN',  pts: 200 },
  'KeyW': { name: 'AERIAL',    pts: 400 },
};

function updateSurfing(dt) {
  if (sf.phase === 'end') { if (keysJustPressed['Enter']) state = 'menu'; return; }

  sf.timerFrac += dt;
  if (sf.timerFrac >= 1) {
    sf.timerFrac -= 1; sf.timer--;
    if (sf.timer <= 0) {
      sf.phase = 'end';
      if (Math.floor(sf.score) > highScores.surfing) highScores.surfing = Math.floor(sf.score);
      sfxScore(); return;
    }
  }

  sf.waveTime += dt; sf.bgOff += sf.speed;
  sf.waveY = H/2 + Math.sin(sf.waveTime*1.4)*55 + Math.sin(sf.waveTime*0.6)*25;

  if (sf.wipeout) {
    sf.wipeoutTimer -= dt;
    if (sf.wipeoutTimer <= 0) { sf.wipeout=false; sf.sx=160; sf.combo=0; }
    return;
  }

  if (keys['ArrowLeft'])  sf.sx = Math.max(30, sf.sx-2);
  if (keys['ArrowRight']) sf.sx = Math.min(W*0.42, sf.sx+2);
  if (keys['ArrowUp'])    sf.sy = Math.max(70, sf.sy-3);
  if (keys['ArrowDown'])  sf.sy = Math.min(H-90, sf.sy+3);

  const dist = sf.sy - sf.waveY;
  sf.angle += (dist*0.018 - sf.angle) * 0.12;

  if (Math.abs(dist) > 110) {
    sf.wipeout=true; sf.wipeoutTimer=2; sf.combo=0; sfxWipeout(); return;
  }

  sf.score += dt * (2 + sf.combo * 0.8);

  if (sf.trickTimer > 0) sf.trickTimer -= dt;
  for (const [k, t] of Object.entries(SURF_TRICKS)) {
    if (keysJustPressed[k] && sf.trickTimer <= 0) {
      const ok = Math.random() < (1 - Math.abs(dist)/100);
      if (ok) {
        sf.trickText=t.name; sf.trickPts=t.pts*(1+sf.combo);
        sf.score+=sf.trickPts; sf.trickTimer=1.5; sf.combo++;
        sfxScore();
      } else {
        sf.wipeout=true; sf.wipeoutTimer=2; sf.combo=0; sfxWipeout();
      }
      break;
    }
  }

  sf.dolphins.forEach(d => {
    d.x -= sf.speed+2; d.ph += dt*3;
    d.y = H*0.72+Math.sin(d.ph)*18;
    if (d.x < -50) d.x = W+80+Math.random()*200;
  });
  sf.birds.forEach(b => {
    b.x -= 1.6; b.ph += dt*2.5;
    b.y = 60+Math.sin(b.ph)*20+(sf.birds.indexOf(b))*35;
    if (b.x < -30) b.x = W+Math.random()*100;
  });
}

function drawSurfing() {
  // Sky
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#5cc8f8'); sky.addColorStop(0.5,'#4a9eff'); sky.addColorStop(1,'#1a5fcc');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // Back waves
  for (let layer=3; layer>=0; layer--) {
    const spd=layer*0.3+0.5, amp=25+layer*18;
    const wo=sf.bgOff*spd;
    const baseY=H*0.44+layer*32;
    const wc=['#003888','#0055aa','#1177cc','#44aaee'][layer];
    ctx.fillStyle=wc;
    ctx.beginPath(); ctx.moveTo(0,H);
    for (let x=0;x<=W;x+=5) {
      const y=baseY+Math.sin((x+wo)*0.022)*amp+Math.sin((x+wo)*0.055)*(amp*0.3);
      x===0?ctx.lineTo(0,y):ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }

  // Main wave face
  const mwy=sf.waveY;
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=3) {
    const y=mwy+Math.sin((x*0.03)+sf.waveTime*2)*14;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

  // Foam crest
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=4;
  ctx.beginPath();
  for (let x=0;x<=W;x+=3) {
    const y=mwy+Math.sin((x*0.03)+sf.waveTime*2)*14-4;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();

  // Dolphins
  sf.dolphins.forEach(d => {
    if (d.x<-30||d.x>W+30) return;
    ctx.fillStyle='#3a7799';
    ctx.beginPath(); ctx.ellipse(d.x,d.y,18,7,Math.sin(d.ph)*0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(d.x-4,d.y-7); ctx.lineTo(d.x+4,d.y-18); ctx.lineTo(d.x+9,d.y-7); ctx.fill();
  });

  // Birds
  sf.birds.forEach(b => {
    ctx.strokeStyle='#222'; ctx.lineWidth=2;
    const w=Math.sin(b.ph)*7;
    ctx.beginPath(); ctx.moveTo(b.x-11,b.y-w); ctx.lineTo(b.x,b.y); ctx.lineTo(b.x+11,b.y-w); ctx.stroke();
  });

  if (sf.wipeout) {
    // Splash
    ctx.fillStyle='#fff';
    for (let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2, r=15+Math.random()*20;
      ctx.beginPath(); ctx.arc(sf.sx+Math.cos(a)*r, sf.sy+Math.sin(a)*r, 4,0,Math.PI*2); ctx.fill();
    }
    ctx.font='bold 28px "Courier New"'; ctx.textAlign='center';
    ctx.fillStyle='#ff2200'; ctx.fillText('WIPEOUT!', W/2, H/2-20);
    ctx.font='14px "Courier New"'; ctx.fillStyle='#fff';
    ctx.fillText('Respawning...', W/2, H/2+12);
  } else {
    // Surfer
    ctx.save(); ctx.translate(sf.sx, sf.sy); ctx.rotate(sf.angle);
    ctx.fillStyle='#ff6633';
    ctx.beginPath(); ctx.ellipse(0,14,38,7,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(0,14,38,7,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#ffdd00'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-9,8); ctx.lineTo(-7,0);
    ctx.moveTo(9,8);  ctx.lineTo(7,0);
    ctx.moveTo(0,0); ctx.lineTo(0,-14);
    ctx.moveTo(-18,-7); ctx.lineTo(0,-11); ctx.lineTo(18,-7);
    ctx.stroke();
    ctx.fillStyle='#ffcc88';
    ctx.beginPath(); ctx.arc(0,-22,8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,38);
  ctx.font='bold 18px "Courier New"';
  ctx.textAlign='left';  ctx.fillStyle='#44aaff'; ctx.fillText('SCORE: '+Math.floor(sf.score), 10, 26);
  ctx.textAlign='center'; ctx.fillStyle='#ffff00'; ctx.fillText('COMBO ×'+sf.combo, W/2, 26);
  ctx.textAlign='right';  ctx.fillStyle=sf.timer<=10?'#ff3300':'#fff'; ctx.fillText('TIME: '+sf.timer, W-10, 26);

  if (sf.trickTimer>0) {
    ctx.globalAlpha=Math.min(1,sf.trickTimer);
    ctx.font='bold 28px "Courier New"'; ctx.textAlign='center';
    ctx.fillStyle='#ffff00'; ctx.fillText(sf.trickText+'!', W/2, H/2-35);
    ctx.font='18px "Courier New"'; ctx.fillStyle='#00ff88';
    ctx.fillText('+'+Math.floor(sf.trickPts)+' pts', W/2, H/2-5);
    ctx.globalAlpha=1;
  }

  ctx.font='11px "Courier New"'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.fillText('↑↓←→ RIDE   A=CUTBACK  S=TUBE  D=HANG TEN  W=AERIAL', W/2, H-6);

  if (sf.phase==='end') drawEndScreen('SURF\'S UP!', Math.floor(sf.score), 'COMBOS: '+sf.combo, '#44aaff', highScores.surfing);
}

// ─── BMX ────────────────────────────────────────────────────────────────────
let bm = {};
function initBMX() {
  const ramps = [];
  for (let i=0;i<7;i++) ramps.push({ x:280+i*240, h:35+Math.random()*65, w:70+Math.random()*30 });

  bm = {
    bx:100, by:H-72,
    vx:5, vy:0,
    score:0, phase:'play',
    onGround:true, inAir:false, airTime:0,
    trickText:'', trickTimer:0, combo:0, totalTricks:0,
    camX:0,
    ramps,
    trackLen:1900,
    crashed:false, crashTimer:0,
    jumped:false,
    doneTricks:new Set(),
    wheelRot:0,
    bgTrees:Array.from({length:22},(_,i)=>({x:i*110+Math.random()*55, h:35+Math.random()*45})),
    clouds:Array.from({length:5},(_,i)=>({x:i*160,y:45+Math.random()*45})),
  };
}

const BMX_TRICKS = {
  'KeyA': { name: 'NO HANDER', pts:200 },
  'KeyS': { name: 'TAILWHIP',  pts:300 },
  'KeyD': { name: '360°',      pts:350 },
  'KeyW': { name: 'SUPERMAN',  pts:400 },
};

function bmxGroundY(x) {
  const gy = H-62;
  for (const r of bm.ramps) {
    if (x > r.x-r.w/2 && x < r.x+r.w/2) {
      const t = (x-(r.x-r.w/2))/r.w;
      return gy - r.h*(1-Math.abs(t*2-1));
    }
  }
  return gy;
}

function updateBMX(dt) {
  if (bm.phase==='end') { if (keysJustPressed['Enter']) state='menu'; return; }

  if (bm.crashed) {
    bm.crashTimer-=dt;
    if (bm.crashTimer<=0) {
      bm.crashed=false; bm.by=H-72; bm.vy=0; bm.onGround=true; bm.combo=0;
    }
    return;
  }

  bm.vx = 5 + bm.totalTricks*0.25;
  if (keys['ArrowRight']) bm.vx+=1.5;
  if (keys['ArrowLeft'])  bm.vx=Math.max(2,bm.vx-1);
  bm.bx+=bm.vx; bm.camX=bm.bx-150;
  bm.wheelRot+=bm.vx*0.13;

  bm.vy+=0.38; bm.by+=bm.vy;

  const gy=bmxGroundY(bm.bx);
  if (bm.by>=gy-18) {
    if (bm.inAir) {
      if (bm.vy>15) { bm.crashed=true; bm.crashTimer=1.5; bm.inAir=false; sfxWipeout(); return; }
      if (bm.airTime>0.3&&bm.doneTricks.size>0) sfxScore();
      bm.inAir=false; bm.airTime=0; bm.doneTricks.clear(); bm.jumped=false;
    }
    bm.by=gy-18; bm.vy=0; bm.onGround=true;
  } else {
    bm.onGround=false; bm.inAir=true; bm.airTime+=dt;
    bm.score+=dt*6;
  }

  if ((keysJustPressed['Space']||keysJustPressed['ArrowUp'])&&bm.onGround&&!bm.jumped) {
    bm.vy=-12; bm.jumped=true; bm.inAir=true; sfxJump();
  }

  if (bm.trickTimer>0) bm.trickTimer-=dt;
  if (bm.inAir&&bm.trickTimer<=0) {
    for (const [k,t] of Object.entries(BMX_TRICKS)) {
      if (keysJustPressed[k]&&!bm.doneTricks.has(t.name)) {
        bm.doneTricks.add(t.name);
        bm.trickText=t.name; bm.trickTimer=0.6;
        bm.score+=t.pts*(bm.combo+1); bm.totalTricks++; bm.combo++;
        sfxKick(); break;
      }
    }
  }

  if (bm.bx>bm.trackLen) {
    bm.phase='end';
    if (Math.floor(bm.score)>highScores.bmx) highScores.bmx=Math.floor(bm.score);
    sfxScore();
  }
}

function drawBMX() {
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#8ad4f0'); sky.addColorStop(0.65,'#ffe080'); sky.addColorStop(1,'#ff9933');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  bm.clouds.forEach(c => {
    const cx=(c.x-bm.camX*0.25+W*2)%(W+200)-100;
    ctx.fillStyle='rgba(255,255,255,0.88)';
    [0,22,44].forEach((d,i)=>{ctx.beginPath();ctx.arc(cx+d,c.y,28-i*4,0,Math.PI*2);ctx.fill();});
  });

  bm.bgTrees.forEach(t => {
    const tx=t.x-bm.camX*0.65;
    if (tx<-30||tx>W+30) return;
    ctx.fillStyle='#7a3e12'; ctx.fillRect(tx-5,H-62-t.h,10,t.h);
    ctx.fillStyle='#2a8a28';
    ctx.beginPath(); ctx.moveTo(tx,H-62-t.h-28); ctx.lineTo(tx-18,H-62-t.h+8); ctx.lineTo(tx+18,H-62-t.h+8); ctx.closePath(); ctx.fill();
  });

  ctx.fillStyle='#7d6340'; ctx.fillRect(0,H-62,W,62);
  ctx.fillStyle='#5e4a2a'; ctx.fillRect(0,H-62,W,5);
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2; ctx.setLineDash([22,22]);
  ctx.beginPath(); ctx.moveTo(0,H-30); ctx.lineTo(W,H-30); ctx.stroke();
  ctx.setLineDash([]);

  bm.ramps.forEach(r => {
    const rx=r.x-bm.camX;
    if (rx<-120||rx>W+120) return;
    ctx.fillStyle='#bb7733';
    ctx.beginPath(); ctx.moveTo(rx-r.w/2,H-62); ctx.lineTo(rx,H-62-r.h); ctx.lineTo(rx+r.w/2,H-62); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#995522'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rx-r.w/2,H-62); ctx.lineTo(rx,H-62-r.h); ctx.lineTo(rx+r.w/2,H-62); ctx.stroke();
  });

  const finX=bm.trackLen-bm.camX;
  if (finX>-30&&finX<W+30) {
    for (let y=H-130;y<H-62;y+=10) for (let i=0;i<2;i++) {
      ctx.fillStyle=(Math.floor(y/10)+i)%2===0?'#000':'#fff';
      ctx.fillRect(finX-10+i*10,y,10,10);
    }
    ctx.fillStyle='#000'; ctx.font='bold 16px "Courier New"';
    ctx.textAlign='center'; ctx.fillText('FINISH!',finX,H-138);
  }

  const bx=bm.bx-bm.camX, by=bm.by;
  if (bm.crashed) {
    ctx.font='bold 28px "Courier New"'; ctx.textAlign='center';
    ctx.fillStyle='#ff2200'; ctx.fillText('CRASH!',bx,by-38);
  } else {
    const spin=bm.inAir&&bm.doneTricks.size>0?Math.sin(bm.airTime*10)*0.25:0;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(spin);
    ctx.strokeStyle='#2222'; ctx.lineWidth=4;
    [-17,17].forEach(wx=>{
      ctx.strokeStyle='#333';
      ctx.beginPath(); ctx.arc(wx,14,12,0,Math.PI*2); ctx.stroke();
      for(let s=0;s<4;s++){const a=s*Math.PI/2+bm.wheelRot;ctx.beginPath();ctx.moveTo(wx,14);ctx.lineTo(wx+Math.cos(a)*10,14+Math.sin(a)*10);ctx.stroke();}
    });
    ctx.strokeStyle='#ee3333'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-17,14); ctx.lineTo(0,-5); ctx.lineTo(17,14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(18,-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18,-18); ctx.lineTo(18,-2); ctx.stroke();
    ctx.fillStyle='#333'; ctx.fillRect(-7,-10,14,4);
    ctx.strokeStyle='#00ffff'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,-5); ctx.lineTo(-7,7); ctx.lineTo(-17,14);
    ctx.moveTo(0,-5); ctx.lineTo(7,5);  ctx.lineTo(17,14);
    ctx.moveTo(0,-5); ctx.lineTo(4,-18); ctx.moveTo(4,-14); ctx.lineTo(18,-10);
    ctx.stroke();
    ctx.fillStyle='#ffcc88'; ctx.beginPath(); ctx.arc(4,-26,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ee3333'; ctx.beginPath(); ctx.arc(4,-26,8,Math.PI,0); ctx.fill();
    ctx.restore();
  }

  const prog=Math.min(1,bm.bx/bm.trackLen);
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,38);
  ctx.font='bold 18px "Courier New"';
  ctx.textAlign='left';  ctx.fillStyle='#ff44aa'; ctx.fillText('SCORE: '+Math.floor(bm.score),10,26);
  ctx.textAlign='center'; ctx.fillStyle='#ffff00'; ctx.fillText('COMBO ×'+bm.combo, W/2, 26);
  ctx.textAlign='right';
  ctx.fillStyle='#555'; ctx.fillRect(W-125,9,105,18);
  ctx.fillStyle='#00dd44'; ctx.fillRect(W-125,9,105*prog,18);
  ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.strokeRect(W-125,9,105,18);
  ctx.fillStyle='#fff'; ctx.font='11px "Courier New"'; ctx.fillText(Math.floor(prog*100)+'%',W-70,24);

  if (bm.trickTimer>0) {
    ctx.font='bold 26px "Courier New"'; ctx.textAlign='center';
    ctx.fillStyle='#ff00ff'; ctx.fillText(bm.trickText+'!',W/2,H/2-28);
  }

  ctx.font='11px "Courier New"'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillText('SPACE/↑ JUMP   A=NO HANDER  S=TAILWHIP  D=360  W=SUPERMAN', W/2, H-6);

  if (bm.phase==='end') drawEndScreen('FINISH LINE!', Math.floor(bm.score), 'TRICKS: '+bm.totalTricks, '#ff44aa', highScores.bmx);
}

// ─── FRISBEE ────────────────────────────────────────────────────────────────
let fr = {};
function initFrisbee() {
  fr = {
    phase:'aim',
    tx:75, ty:H-72,
    dx:75, dy:H-72,
    dvx:0, dvy:0,
    angle:-40, power:50, powerDir:1, spin:0,
    windX:(Math.random()-0.5)*2.4, windY:(Math.random()-0.5)*0.5,
    totalScore:0, lastPts:0, lastText:'',
    throws:0, maxThrows:5,
    trickTimer:0, resultTimer:0,
    trail:[],
    bgOff:0, throwAnim:0,
    targets:[
      {x:420,r:72,pts:50,  color:'#4488ff'},
      {x:420,r:44,pts:200, color:'#ffaa00'},
      {x:420,r:20,pts:500, color:'#ff3300'},
    ],
  };
}

function updateFrisbee(dt) {
  fr.bgOff+=0.4;
  if (fr.trickTimer>0) fr.trickTimer-=dt;

  if (fr.phase==='end') { if (keysJustPressed['Enter']) state='menu'; return; }

  if (fr.phase==='aim') {
    fr.power+=fr.powerDir*dt*75;
    if (fr.power>=100){fr.power=100;fr.powerDir=-1;}
    if (fr.power<=0)  {fr.power=0;  fr.powerDir=1;}
    if (keys['ArrowUp'])   fr.angle=Math.max(-82,fr.angle-55*dt);
    if (keys['ArrowDown']) fr.angle=Math.min(-6, fr.angle+55*dt);
    if (keysJustPressed['Space']||keysJustPressed['Enter']) {
      const rad=fr.angle*Math.PI/180;
      const spd=fr.power*0.11+4;
      fr.dvx=Math.cos(rad)*spd; fr.dvy=Math.sin(rad)*spd;
      fr.dx=fr.tx+22; fr.dy=fr.ty-28;
      fr.spin=fr.dvx*0.4;
      fr.trail=[]; fr.throws++; fr.throwAnim=0.35;
      fr.phase='fly'; sfxJump();
    }
    return;
  }

  if (fr.phase==='fly') {
    fr.dvx+=fr.windX*dt*0.4; fr.dvy+=0.13; fr.dvy+=fr.windY*dt;
    fr.dvx*=0.999; fr.dx+=fr.dvx; fr.dy+=fr.dvy;
    fr.spin+=fr.dvx*0.08;
    fr.trail.push({x:fr.dx,y:fr.dy});
    if (fr.trail.length>25) fr.trail.shift();

    if (fr.dy>=H-72||fr.dx>W+60||fr.dx<-60) {
      fr.lastPts=0; fr.lastText='OUT OF BOUNDS';
      if (fr.dx>0&&fr.dx<W) {
        fr.lastPts=10; fr.lastText='IN BOUNDS! +10';
        for (const t of fr.targets) {
          const d=Math.sqrt((fr.dx-t.x)**2+(fr.dy-(H-72))**2);
          if (d<t.r) { fr.lastPts=t.pts; fr.lastText=t.pts+' POINTS!'; }
        }
      }
      fr.totalScore+=fr.lastPts; fr.trickTimer=2; fr.phase='result'; fr.resultTimer=2.2;
      fr.lastPts>100?sfxScore():sfxKick();
    }
    return;
  }

  if (fr.phase==='result') {
    fr.resultTimer-=dt;
    if (fr.resultTimer<=0) {
      if (fr.throws>=fr.maxThrows) {
        fr.phase='end';
        if (fr.totalScore>highScores.frisbee) highScores.frisbee=fr.totalScore;
      } else {
        fr.phase='aim'; fr.dx=fr.tx; fr.dy=fr.ty; fr.power=50;
        fr.windX=(Math.random()-0.5)*2.4; fr.windY=(Math.random()-0.5)*0.5;
        fr.trail=[];
      }
    }
  }
}

function drawFrisbee() {
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#7dd6f0'); sky.addColorStop(0.7,'#a8eaff'); sky.addColorStop(1,'#ffe89a');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.82)';
  [[0,55,28],[180,42,22],[350,68,32],[510,50,25]].forEach(([ox,y,r])=>{
    const cx=((fr.bgOff*0.18+ox)%(W+120))-60;
    [0,20,40].forEach((d,i)=>{ctx.beginPath();ctx.arc(cx+d,y,r-i*5,0,Math.PI*2);ctx.fill();});
  });

  ctx.fillStyle='#5cc45c';
  ctx.beginPath(); ctx.moveTo(0,H-72);
  for(let x=0;x<=W;x+=5) ctx.lineTo(x, H-72-Math.sin((x+fr.bgOff*0.08)*0.018)*38);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();

  ctx.fillStyle='#7ada7a'; ctx.fillRect(0,H-72,W,72);
  ctx.fillStyle='#50b050'; ctx.fillRect(0,H-72,W,5);

  // Target rings (ellipse on ground)
  [...fr.targets].reverse().forEach(t => {
    ctx.globalAlpha=0.45; ctx.fillStyle=t.color;
    ctx.beginPath(); ctx.ellipse(t.x,H-72,t.r,t.r*0.28,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.85; ctx.strokeStyle=t.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(t.x,H-72,t.r,t.r*0.28,0,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font='bold 11px "Courier New"'; ctx.textAlign='center';
    ctx.fillStyle=t.color; ctx.fillText(t.pts+'pt', t.x, H-72-t.r*0.28-4);
  });

  // Distance markers
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  for(let d=100;d<W;d+=100){
    ctx.beginPath(); ctx.moveTo(d,H-72); ctx.lineTo(d,H-55); ctx.stroke();
    ctx.font='10px "Courier New"'; ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.textAlign='center';
    ctx.fillText(d+'ft',d,H-42);
  }
  ctx.setLineDash([]);

  // Catcher
  const cx2=fr.targets[0].x, cy2=H-72;
  ctx.strokeStyle='#333'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx2,cy2-55,9,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx2,cy2-46); ctx.lineTo(cx2,cy2-18);
  ctx.moveTo(cx2,cy2-18); ctx.lineTo(cx2-10,cy2); ctx.moveTo(cx2,cy2-18); ctx.lineTo(cx2+10,cy2);
  ctx.moveTo(cx2-18,cy2-38); ctx.lineTo(cx2,cy2-33); ctx.lineTo(cx2+18,cy2-38);
  ctx.stroke();

  // Thrower
  if (fr.throwAnim>0) fr.throwAnim-=0.04;
  ctx.strokeStyle='#003399'; ctx.lineWidth=3;
  const tpx=fr.tx, tpy=fr.ty;
  ctx.beginPath(); ctx.arc(tpx,tpy-48,9,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tpx,tpy-39); ctx.lineTo(tpx,tpy-10);
  ctx.moveTo(tpx,tpy-10); ctx.lineTo(tpx-10,tpy); ctx.moveTo(tpx,tpy-10); ctx.lineTo(tpx+10,tpy);
  ctx.stroke();
  const armRad=(fr.angle+(fr.throwAnim>0?28:0))*Math.PI/180;
  ctx.beginPath(); ctx.moveTo(tpx-14,tpy-24); ctx.lineTo(tpx+Math.cos(armRad)*26, tpy-24+Math.sin(armRad)*24); ctx.stroke();

  // Aim arrow
  if (fr.phase==='aim') {
    const rad=fr.angle*Math.PI/180, len=70+fr.power*0.55;
    ctx.strokeStyle='rgba(255,255,0,0.7)'; ctx.lineWidth=2; ctx.setLineDash([8,5]);
    ctx.beginPath(); ctx.moveTo(tpx,tpy-28); ctx.lineTo(tpx+Math.cos(rad)*len, tpy-28+Math.sin(rad)*len); ctx.stroke();
    ctx.setLineDash([]);
    const ex=tpx+Math.cos(rad)*len, ey=tpy-28+Math.sin(rad)*len;
    ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(ex,ey,5,0,Math.PI*2); ctx.fill();
  }

  // Trail
  fr.trail.forEach((p,i)=>{
    ctx.fillStyle=`rgba(255,210,0,${(i/fr.trail.length)*0.5})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  });

  // Disc
  if (fr.phase==='fly'||fr.phase==='result') {
    ctx.save(); ctx.translate(fr.dx,fr.dy); ctx.rotate(fr.spin);
    ctx.fillStyle='#ffdd00';
    ctx.beginPath(); ctx.ellipse(0,0,18,6,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#cc8800'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,0,18,6,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#ffee66';
    ctx.beginPath(); ctx.ellipse(0,-2,12,4,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (fr.phase==='aim') {
    const drad=fr.angle*Math.PI/180;
    ctx.fillStyle='#ffdd00';
    ctx.beginPath(); ctx.ellipse(tpx+16,tpy-26,12,4,drad,0,Math.PI*2); ctx.fill();
  }

  // Wind indicator
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(8,46,130,40);
  ctx.font='12px "Courier New"'; ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.fillText('WIND:',14,62);
  const ws=Math.sqrt(fr.windX**2+fr.windY**2);
  ctx.fillStyle=ws>1?'#ff6644':'#44ee88';
  ctx.fillText((fr.windX>0?'→':'←')+' '+ws.toFixed(1), 62, 62);
  ctx.fillStyle='#aaa'; ctx.fillText('Throw '+fr.throws+'/'+fr.maxThrows, 14, 79);

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,38);
  ctx.font='bold 18px "Courier New"';
  ctx.textAlign='left';  ctx.fillStyle='#ffff00'; ctx.fillText('SCORE: '+fr.totalScore, 10, 26);
  ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.fillText('THROWS: '+fr.throws+'/'+fr.maxThrows, W-10, 26);

  if (fr.phase==='aim') {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W/2-82,8,164,24);
    ctx.fillStyle=fr.power>80?'#ff4400':fr.power>50?'#ffaa00':'#00dd44';
    ctx.fillRect(W/2-80,10,fr.power*1.6,20);
    ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.strokeRect(W/2-82,8,164,24);
    ctx.font='11px "Courier New"'; ctx.textAlign='center'; ctx.fillStyle='#000';
    ctx.fillText('POWER '+Math.floor(fr.power)+'%', W/2, 25);
  }

  if (fr.trickTimer>0&&fr.lastText) {
    ctx.globalAlpha=Math.min(1,fr.trickTimer);
    ctx.font='bold 28px "Courier New"'; ctx.textAlign='center';
    ctx.fillStyle=fr.lastPts>100?'#ffff00':'#ff4444'; ctx.fillText(fr.lastText, W/2, H/2-28);
    ctx.globalAlpha=1;
  }

  ctx.font='11px "Courier New"'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.45)';
  if (fr.phase==='aim') ctx.fillText('↑↓ ANGLE   Watch POWER bar   SPACE to THROW!', W/2, H-6);

  if (fr.phase==='end') drawEndScreen('NICE THROWS!', fr.totalScore, 'AVG: '+Math.floor(fr.totalScore/fr.maxThrows)+'/throw', '#ffff00', highScores.frisbee);
}

// ─── SHARED END SCREEN ─────────────────────────────────────────────────────
function drawEndScreen(title, score, sub, color, hiScore) {
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.font='bold 36px "Courier New"'; ctx.textAlign='center';
  ctx.fillStyle=color; ctx.fillText(title, W/2, H/2-65);
  ctx.font='24px "Courier New"';
  ctx.fillStyle='#ffff00'; ctx.fillText('SCORE: '+score, W/2, H/2-22);
  ctx.fillStyle='#aaaaaa'; ctx.font='18px "Courier New"'; ctx.fillText(sub, W/2, H/2+18);
  if (score>=hiScore&&score>0) {
    ctx.fillStyle='#ff00ff'; ctx.font='bold 22px "Courier New"';
    ctx.fillText('★  NEW HIGH SCORE!  ★', W/2, H/2+60);
  } else if (hiScore>0) {
    ctx.fillStyle='#555'; ctx.font='14px "Courier New"';
    ctx.fillText('BEST: '+hiScore, W/2, H/2+60);
  }
  ctx.font='16px "Courier New"'; ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('ENTER  —  Main Menu', W/2, H/2+100);
}

// ─── GAME INIT & LOOP ───────────────────────────────────────────────────────
function initGame(s) {
  if (s==='hackySack') initHackySack();
  else if (s==='halfpipe') initHalfpipe();
  else if (s==='surfing') initSurfing();
  else if (s==='bmx') initBMX();
  else if (s==='frisbee') initFrisbee();
}

let lastTime = null;
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (Object.keys(keysJustPressed).length > 0) initAudio();

  ctx.clearRect(0, 0, W, H);

  if      (state==='menu')      { updateMenu();       drawMenu(); }
  else if (state==='hackySack') { updateHackySack(dt); drawHackySack(); }
  else if (state==='halfpipe')  { updateHalfpipe(dt);  drawHalfpipe(); }
  else if (state==='surfing')   { updateSurfing(dt);   drawSurfing(); }
  else if (state==='bmx')       { updateBMX(dt);       drawBMX(); }
  else if (state==='frisbee')   { updateFrisbee(dt);   drawFrisbee(); }

  if (state !== 'menu' && keysJustPressed['Escape']) state = 'menu';

  for (const k in keysJustPressed) delete keysJustPressed[k];

  ui.textContent = state==='menu'
    ? 'CALIFORNIA GAMES  —  ↑↓ select sport  •  ENTER start'
    : 'ESC = Main Menu';

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
