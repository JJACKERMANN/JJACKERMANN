<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Games</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;overflow:hidden;}
@media(max-width:680px){
  body{overflow-y:auto;justify-content:flex-start;padding-top:4px;}
  #wrap{width:100vw !important;border-left:none;border-right:none;}
  canvas{width:100%;height:auto;}
}
#wrap{position:relative;border:3px solid #ff6600;box-shadow:0 0 40px #ff660055;}
canvas{display:block;image-rendering:pixelated;}
#crt{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,
  rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);}
#ni{position:absolute;background:transparent;border:2px solid #ff6600;
  border-radius:4px;color:#ff6600;
  font-family:'Press Start 2P',monospace;font-size:14px;text-align:center;
  outline:none;display:none;text-transform:uppercase;width:224px;
  transform:translateX(-50%);letter-spacing:2px;padding:6px 4px;line-height:1;}
#ui{color:#333;font-family:'Press Start 2P',monospace;font-size:9px;
  margin-top:6px;text-align:center;}
/* Touch controls */
.tcb{display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;
  background:rgba(0,0,20,0.58);
  border:2px solid rgba(255,100,0,0.52);
  border-radius:10px;color:rgba(255,210,60,0.95);font-size:20px;
  user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;cursor:pointer;pointer-events:auto;}
.tcb.sm{width:42px;height:42px;font-size:9px;font-family:'Press Start 2P',monospace;}
.tcb.lg{width:66px;height:66px;font-size:24px;border-color:rgba(255,100,0,0.8);}
.tcb.on{background:rgba(255,100,0,0.42);}
#tc-dp{position:absolute;left:6px;bottom:8px;display:none;
  grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);
  gap:3px;pointer-events:none;}
#tc-act{position:absolute;right:6px;bottom:8px;display:none;
  flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none;}
@media(hover:none)and(pointer:coarse){
  #tc-dp{display:grid;}
  #tc-act{display:flex;}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="400"></canvas>
  <div id="crt"></div>
  <input id="ni" type="text" maxlength="10" autocomplete="off" spellcheck="false">
  <div id="tc-dp">
    <span></span><button class="tcb" data-key="ArrowUp">↑</button><span></span>
    <button class="tcb" data-key="ArrowLeft">←</button><span></span><button class="tcb" data-key="ArrowRight">→</button>
    <span></span><button class="tcb" data-key="ArrowDown">↓</button><span></span>
  </div>
  <div id="tc-act">
    <div style="display:flex;gap:4px;">
      <button class="tcb sm" data-key="Escape">ESC</button>
      <button class="tcb sm" data-key="Enter">OK</button>
    </div>
    <button class="tcb lg" data-key="Space">◉</button>
  </div>
</div>
<div id="ui">CALIFORNIA GAMES</div>
<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=640,H=400;
const ni=document.getElementById('ni');

// ── INPUT ────────────────────────────────────────────────────────────────────
const keys={},kp={};
document.addEventListener('keydown',e=>{
  if(!keys[e.code])kp[e.code]=true;
  keys[e.code]=true;
  if(document.activeElement!==ni)e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// ── AUDIO ────────────────────────────────────────────────────────────────────
let actx;
let _introIds=[];
let _introStarted=false;
let _introStartTime=0;
function ia(){
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    // Delay intro so it starts after the current game-loop tick completes
    // (prevents the title's sfx.stopIntro from cancelling it immediately)
    if(!_introStarted){_introStarted=true;setTimeout(()=>sfx.intro(),150);}
  }
}
function beep(f,d,t='square',v=0.08){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.frequency.value=f;o.type=t;
  g.gain.setValueAtTime(v,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);
  o.start();o.stop(actx.currentTime+d);
}
const sfx={
  tick: ()=>beep(440,0.04,'square',0.06),
  kick: ()=>beep(220,0.1,'square',0.12),
  score:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.1),i*70)),
  oof:  ()=>beep(180,0.4,'sawtooth',0.12),
  jump: ()=>beep(380,0.1,'square',0.1),
  sel:  ()=>beep(600,0.07,'square',0.09),
  stopIntro:()=>{_introIds.forEach(id=>clearTimeout(id));_introIds=[];_introStartTime=0;},
  intro:()=>{
    if(!actx)return;
    _introStartTime=performance.now();
    // Chemical Brothers "Go"-inspired chiptune — A minor, 120 BPM, 8s loop
    // 4 bars × 16 sixteenths × 125ms = 8 000ms
    const Q=500; // quarter note ms
    const S=125; // sixteenth note ms

    // ── Lead stab (square — short, punchy, urgent) ────────────────────────────
    const MEL=[
      // Bar 1: A A C A  G A C E(held 2)
      [440,   0, S*.8],[440, 2*S, S*.8],[523, 3*S, S*.8],
      [440, 4*S, S*.8],[392, 6*S, S*.8],[440, 8*S, S*.8],
      [523,10*S, S*.8],[659,12*S, S*2.8],
      // Bar 2: synco A C D  E(held) F E D(held)
      [440,17*S, S*.8],[523,19*S, S*.8],[587,20*S, S*.8],
      [659,22*S, S*1.8],[698,26*S, S*.8],[659,28*S, S*.8],[587,30*S, S*1.8],
      // Bar 3: build C D E G  A G A G
      [523,32*S, S*.8],[587,34*S, S*.8],[659,36*S, S*.8],[784,38*S, S*.8],
      [880,40*S, S*.8],[784,42*S, S*.8],[880,44*S, S*.8],[784,46*S, S*.8],
      // Bar 4: drop A F E C  A(held)
      [880,48*S, S*.8],[698,50*S, S*.8],[659,52*S, S*.8],
      [523,54*S, S*.8],[440,56*S, S*3.8],
    ];
    MEL.forEach(([f,t,d])=>_introIds.push(setTimeout(()=>beep(f,d/1000,'square',0.11),t)));

    // ── Sub bass (sawtooth — driving, syncopated) ─────────────────────────────
    const BAS=[
      [110,   0],[110, 3*S],[98,  4*S],[110, 8*S],[110,11*S],[82, 12*S],
      [110,16*S],[110,19*S],[98, 20*S],[110,24*S],[73, 28*S],
      [110,32*S],[110,35*S],[98, 36*S],[110,40*S],[82, 44*S],
      [110,48*S],[82, 52*S],[110,56*S],
    ];
    BAS.forEach(([f,t])=>_introIds.push(setTimeout(()=>beep(f,S*1.8/1000,'sawtooth',0.17),t)));

    // ── Kick: four-on-the-floor ───────────────────────────────────────────────
    for(let i=0;i<16;i++)
      _introIds.push(setTimeout(()=>beep(52,0.25,'sine',0.26),i*Q));

    // ── Snare: beats 2 & 4 every bar ─────────────────────────────────────────
    for(let i=0;i<8;i++)
      _introIds.push(setTimeout(()=>beep(200,0.10,'sawtooth',0.09),(2*i+1)*Q));

    // ── Hi-hat: 8th notes bars 1-2, 16th notes bars 3-4 (build tension) ──────
    for(let i=0;i<16;i++)
      _introIds.push(setTimeout(()=>beep(6000+Math.random()*3000,0.05,'square',0.020),i*(Q/2)));
    for(let i=32;i<64;i++)
      _introIds.push(setTimeout(()=>beep(7000+Math.random()*2000,0.04,'square',0.018),i*S));
  },
};

];
const EQUIP={
  halfpipe:[
    {name:'CLASSIC',  desc:'Balanced all-rounder', bonus:1.0, col:'#ff6600'},
    {name:'PRO MODEL',desc:'+15% trick score',      bonus:1.15,col:'#ff00ff'},
    {name:'STREET',   desc:'+10% speed gains',      bonus:1.1, col:'#00ffff'},
  ],
  surfing:[
    {name:'SHORTBOARD',desc:'+10% trick score',     bonus:1.1, col:'#0088ff'},
    {name:'LONGBOARD', desc:'Wider sweet spot',     bonus:1.0, col:'#ffaa00'},
    {name:'FISH',      desc:'+5% all scoring',      bonus:1.05,col:'#00ff88'},
  ],
  bmx:[
    {name:'FREESTYLE', desc:'+10% trick score',     bonus:1.1, col:'#ff0088'},
    {name:'RACING',    desc:'+10% speed score',     bonus:1.1, col:'#00ffff'},
    {name:'CRUISER',   desc:'Balanced all-rounder', bonus:1.0, col:'#ffaa00'},
  ],
};
const SPORTS=[
  {key:'hackySack',label:'HACKY SACK',col:'#00ff88'},
  {key:'halfpipe', label:'HALF-PIPE', col:'#ff6600'},
  {key:'surfing',  label:'SURFING',   col:'#44aaff'},
  {key:'bmx',      label:'BMX',       col:'#ff44aa'},
  {key:'frisbee',  label:'FRISBEE',   col:'#ffff00'},
  {key:'snowboard',label:'SNOWBOARD', col:'#aaddff'},
];
const _sHS=JSON.parse(localStorage.getItem('cg_hs')||'{}');
const HS={hackySack:_sHS.hackySack||0,halfpipe:_sHS.halfpipe||0,surfing:_sHS.surfing||0,bmx:_sHS.bmx||0,frisbee:_sHS.frisbee||0,snowboard:_sHS.snowboard||0};
function saveHS(k,s){if(s>HS[k]){HS[k]=Math.floor(s);localStorage.setItem('cg_hs',JSON.stringify(HS));}}
const player={
  name:'PLAYER',heroIdx:0,sponsorIdx:0,
  equip:{halfpipe:0,surfing:0,bmx:0},
  get hero(){return HEROES[this.heroIdx];},
  get color(){return HEROES[this.heroIdx].color;},
  get accent(){return HEROES[this.heroIdx].accent;},
  get sponsor(){return SPONSORS[this.sponsorIdx];},
  bonus(sport){
    const h=this.hero;
    let b=1+(h.sportBonus[sport]||0);
    if(this.sponsor.sport===sport) b+=this.sponsor.pct/100;
    if(EQUIP[sport]) b*=EQUIP[sport][this.equip[sport]].bonus;
    return b;
  },
};

// ── TEXT HELPERS ─────────────────────────────────────────────────────────────
function T(s,x,y,c='#fff',sz=8,al='center'){
  ctx.font=`${sz}px "Press Start 2P",monospace`;
  ctx.textAlign=al;ctx.fillStyle=c;ctx.fillText(s,x,y);
}
function T2(s,x,y,c1,c2,sz=14){
  ctx.font=`${sz}px "Press Start 2P",monospace`;
  ctx.textAlign='center';
  ctx.fillStyle=c2;ctx.fillText(s,x+2,y+2);
  ctx.fillStyle=c1;ctx.fillText(s,x,y);
}
function drawHead(cx,cy,r,hero){
  ctx.fillStyle='#f5c08a';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  if(hero.helmet){
    ctx.fillStyle=hero.color;ctx.beginPath();ctx.arc(cx,cy,r+3,Math.PI,0);ctx.fill();
    ctx.fillStyle=hero.accent;ctx.fillRect(cx-r-4,cy-2,r*2+8,4);
  } else if(hero.cap){
    ctx.fillStyle=hero.accent;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.fill();
    ctx.fillStyle=hero.color;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=hero.accent;ctx.fillRect(cx-r-4,cy-2,r*2+8,5);
  } else {
    ctx.fillStyle=hero.hair;ctx.beginPath();ctx.arc(cx,cy-2,r*0.75,Math.PI*1.1,Math.PI*1.9,false);ctx.fill();
  }
  if(hero.shades){
    ctx.fillStyle='#003888';
    ctx.fillRect(cx-r*0.75,cy-r*0.2,r*0.6,r*0.38);
    ctx.fillRect(cx+r*0.15,cy-r*0.2,r*0.6,r*0.38);
    ctx.fillStyle='#fff';ctx.fillRect(cx-r*0.14,cy-r*0.2,r*0.28,r*0.38);
  }
  if(hero.band){
    ctx.fillStyle=hero.accent;ctx.fillRect(cx-r,cy-r*0.5,r*2,r*0.28);
  }
  ctx.strokeStyle='#00000044';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
}
function drawHeroPortrait(x,y,hero,big){
  const sc=big?1.6:1;
  const r=big?18:11;
  // Legs
  ctx.strokeStyle=hero.color;ctx.lineWidth=big?5:3;
  ctx.beginPath();
  ctx.moveTo(x-6*sc,y+4*sc);ctx.lineTo(x-9*sc,y+22*sc);
  ctx.moveTo(x+6*sc,y+4*sc);ctx.lineTo(x+9*sc,y+22*sc);
  ctx.stroke();
  // Shorts
  ctx.fillStyle=hero.accent;
  ctx.fillRect(x-10*sc,y+1*sc,20*sc,8*sc);
  // Torso
  ctx.fillStyle=hero.color;
  ctx.beginPath();
  ctx.moveTo(x-10*sc,y+1*sc);ctx.lineTo(x+10*sc,y+1*sc);
  ctx.lineTo(x+8*sc,y-18*sc);ctx.lineTo(x-8*sc,y-18*sc);
  ctx.closePath();ctx.fill();
  // Arms
  ctx.strokeStyle=hero.color;ctx.lineWidth=big?4:2.5;
  ctx.beginPath();
  ctx.moveTo(x-8*sc,y-16*sc);ctx.lineTo(x-22*sc,y-6*sc);
  ctx.moveTo(x+8*sc,y-16*sc);ctx.lineTo(x+22*sc,y-6*sc);
  ctx.stroke();
  // Head
  drawHead(x,y-28*sc,r,hero);
}

// ── SUNSET BG (shared) ───────────────────────────────────────────────────────
function drawSunsetBg(tick){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d0033');sky.addColorStop(0.45,'#3d0066');
  sky.addColorStop(0.75,'#cc3300');sky.addColorStop(1,'#ff8800');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffcc00';
  ctx.beginPath();ctx.arc(W/2,H*.52,65,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ff8800';
  for(let i=0;i<7;i++){
    const sy=H*.52-56+i*17+(Math.floor(tick/20)%2)*8;
    const hw=Math.sqrt(Math.max(0,65*65-(sy-H*.52)**2));
    if(hw>0)ctx.fillRect(W/2-hw,sy,hw*2,9);
  }
  ctx.fillStyle='#001133';ctx.fillRect(0,H*.52,W,H*.08);
  ctx.strokeStyle='#ff00ff';ctx.lineWidth=1;
  for(let i=0;i<=9;i++){
    const t=i/9,y=H*.6+t*H*.4;
    ctx.globalAlpha=t*.55;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  for(let i=-6;i<=6;i++){
    ctx.beginPath();ctx.moveTo(W/2+i*65,H*.6);ctx.lineTo(W/2+i*330,H);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#1a0033';ctx.fillRect(0,H*.6,W,H*.4);
}

// ── STATE ────────────────────────────────────────────────────────────────────
let state='title',tick=0;
let heroSel=0,spSel=0,eqRow=0;
const EQ_ROWS=['halfpipe','surfing','bmx'];
let menuSel=0,menuTick=0;

// ── TITLE ────────────────────────────────────────────────────────────────────
function updateTitle(){
  tick++;
  if(kp['Enter']||kp['Space']){
    state='profileName';
    ni.style.display='block';
    ni.style.left='50%';
    ni.style.top='150px';
    ni.value='';
    setTimeout(()=>ni.focus(),50);
    sfx.sel();
  }
}
function drawTitle(){
  drawSunsetBg(tick);
  T2('CALIFORNIA',W/2,52,'#ffffff','#ff0088',38);
  T2('GAMES',W/2,98,'#ffff00','#ff6600',32);
  if(Math.floor(tick/30)%2===0) T('PRESS  ENTER',W/2,H*.76,'#ffffff',12);
  T('© 1987 EPYX  •  BROWSER REMAKE',W/2,H-14,'#333',7);
}

// ── PROFILE NAME ─────────────────────────────────────────────────────────────
function updateProfileName(){
  if((kp['Enter'])&&ni.value.trim().length>0){
    player.name=ni.value.trim().toUpperCase().slice(0,10);
    ni.style.display='none';
    state='heroSelect';
    heroSel=0;
    sfx.sel();
  }
}
function drawProfileName(){
  ctx.fillStyle='#07071a';ctx.fillRect(0,0,W,H);
  T('CREATE PROFILE',W/2,42,'#ffff00',14);
  ctx.fillStyle='#2a2a44';ctx.fillRect(40,56,W-80,2);
  T('ENTER YOUR NAME:',W/2,100,'#00ffff',9);
  T('(UP TO 10 CHARS)',W/2,120,'#444',7);
  ctx.strokeStyle='#ff6600';ctx.lineWidth=2;
  ctx.strokeRect(W/2-112,148,224,42);
  T('PRESS ENTER TO CONFIRM',W/2,H-14,'#444',7);
}

// ── HERO SELECT ───────────────────────────────────────────────────────────────
function updateHeroSelect(){
  if(kp['ArrowLeft']){heroSel=(heroSel-1+HEROES.length)%HEROES.length;sfx.tick();}
  if(kp['ArrowRight']){heroSel=(heroSel+1)%HEROES.length;sfx.tick();}
  if(kp['Enter']){player.heroIdx=heroSel;state='sponsor';spSel=0;sfx.sel();}
}
function drawHeroSelect(){
  ctx.fillStyle='#07071a';ctx.fillRect(0,0,W,H);
  T('CREATE PROFILE',W/2,42,'#ffff00',14);
  ctx.fillStyle='#2a2a44';ctx.fillRect(40,56,W-80,2);
  T('CHOOSE YOUR HERO:',W/2,80,'#00ffff',9);

  const cardW=110,cardH=200,startX=W/2-(HEROES.length/2-0.5)*cardW;
  HEROES.forEach((h,i)=>{
    const cx=startX+i*cardW,cy=H/2-10;
    const sel=i===heroSel;
    // Card bg
    ctx.fillStyle=sel?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.03)';
    ctx.fillRect(cx-48,cy-100,96,cardH);
    if(sel){
      ctx.strokeStyle=h.color;ctx.lineWidth=2;
      ctx.strokeRect(cx-48,cy-100,96,cardH);
    }
    // Portrait
    drawHeroPortrait(cx,cy-28,h,false);
    // Name
    T(h.name,cx,cy+40,sel?h.color:'#666',sel?9:7);
    T(h.title,cx,cy+56,sel?'#ccc':'#444',5);
    // Stat bars
    const stats=['speed','tricks','balance','air'];
    const scols=['#ff4444','#ffaa00','#44ffaa','#44aaff'];
    stats.forEach((st,si)=>{
      const bx=cx-36,by=cy+68+si*14;
      T(st.slice(0,3).toUpperCase(),bx-6,by+7,'#555',5,'right');
      for(let b=0;b<5;b++){
        ctx.fillStyle=b<h.stats[st]?scols[si]:'#1a1a2e';
        ctx.fillRect(bx+b*14,by,12,8);
      }
    });
    // Bonus tags

// ══════════════════════════════════════════════════════════════════════════════
// HACKY SACK
// ══════════════════════════════════════════════════════════════════════════════
let hk={};
function initHackySack(){
  hk={px:W/2,py:H-78,bx:W/2,by:H-130,bvx:1.8,bvy:-4,
    score:0,kicks:0,combo:0,timer:90,timerFrac:0,
    kickCD:0,trickTimer:0,trickText:'',trickPts:0,phase:'play',bgO:0,
    gull:{active:false,x:0,y:0,spd:0,dir:1,spawnT:8,wing:0,hit:false,hitT:0,feathers:[]},
    drop:{active:false,x:0,y:0,vy:0,pts:0,rot:0},
    bonusTxt:'',bonusTxtT:0,
    power:{active:false,timer:0,triggered:false,pvx:0,pvy:0,auraT:0,shootCD:0,sacks:[],birds:[]}};
}
function updateHackySack(dt){
  if(hk.phase==='end'){if(kp['Enter'])state='menu';return;}
  hk.timerFrac+=dt;
  if(hk.timerFrac>=1){hk.timerFrac-=1;hk.timer--;
    if(hk.timer<=0){hk.phase='end';saveHS('hackySack',hk.score);sfx.score();return;}}
  hk.bgO+=0.4;if(hk.kickCD>0)hk.kickCD-=dt;if(hk.trickTimer>0)hk.trickTimer-=dt;
  if(hk.bonusTxtT>0)hk.bonusTxtT-=dt;
  const pw=hk.power;

  if(pw.active){
    // ── POWER MODE ────────────────────────────────────────────────────────
    pw.timer-=dt;pw.auraT+=dt;
    if(pw.shootCD>0)pw.shootCD-=dt;

    // Flight
    if(keys['ArrowLeft']) pw.pvx-=320*dt;
    if(keys['ArrowRight'])pw.pvx+=320*dt;
    if(keys['ArrowUp'])   pw.pvy-=320*dt;
    if(keys['ArrowDown']) pw.pvy+=320*dt;
    pw.pvx*=0.85;pw.pvy*=0.85;
    hk.px=Math.max(22,Math.min(W-22,hk.px+pw.pvx*dt));
    hk.py=Math.max(55,Math.min(H-40,hk.py+pw.pvy*dt));

    // Shoot sack at nearest bird
    if((kp['Space']||pw.shootCD<=0)&&pw.shootCD<=0){
      let nb=null,nd=Infinity;
      pw.birds.forEach(b=>{if(b.dead)return;const d=Math.hypot(b.x-hk.px,b.y-hk.py);if(d<nd){nd=d;nb=b;}});
      if(nb){
        const d=Math.hypot(nb.x-hk.px,nb.y-hk.py)||1;
        pw.sacks.push({x:hk.px,y:hk.py-20,vx:(nb.x-hk.px)/d*9,vy:(nb.y-hk.py)/d*9});
      } else {
        pw.sacks.push({x:hk.px,y:hk.py-20,vx:0,vy:-9});
      }
      pw.shootCD=0.22;sfx.kick();
    }

    // Update sacks
    pw.sacks=pw.sacks.filter(s=>{
      s.x+=s.vx;s.y+=s.vy;
      return s.x>-10&&s.x<W+10&&s.y>-10&&s.y<H+10;
    });

    // Update birds
    pw.birds.forEach(b=>{
      if(b.dead){b.deadT-=dt;b.feathers.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=0.2;f.life-=dt;});return;}
      b.ph+=dt*3;
      const ddx=hk.px-b.x,ddy=hk.py-b.y,dd=Math.hypot(ddx,ddy)||1;
      b.vx+=(ddx/dd)*2.2*dt*10+Math.sin(b.ph+1.5)*0.6;
      b.vy+=(ddy/dd)*2.2*dt*10+Math.cos(b.ph)*0.4;
      b.vx*=0.91;b.vy*=0.91;b.x+=b.vx;b.y+=b.vy;
      // Sack collision
      for(let si=pw.sacks.length-1;si>=0;si--){
        const s=pw.sacks[si];
        if(Math.hypot(s.x-b.x,s.y-b.y)<22){
          b.dead=true;b.deadT=0.9;b.feathers=[];
          for(let i=0;i<7;i++)b.feathers.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*5,vy:Math.random()*-4-1,life:0.9});
          const pts=50*(hk.combo+1)*player.bonus('hackySack')|0;
          hk.score+=pts;hk.bonusTxt='BIRD DOWN! +'+pts;hk.bonusTxtT=1.4;
          pw.sacks.splice(si,1);sfx.score();break;
        }
      }
    });
    pw.birds=pw.birds.filter(b=>!b.dead||b.deadT>0);

    if(pw.timer<=0){
      pw.active=false;hk.py=H-78;hk.px=W/2;
      hk.bx=W/2;hk.by=H-130;hk.bvx=1.8;hk.bvy=-4;
      hk.bonusTxt='POWER DOWN!';hk.bonusTxtT=2.2;
    }
  } else {
    // ── NORMAL PLAY ───────────────────────────────────────────────────────
    if(keys['ArrowLeft']) hk.px=Math.max(30,hk.px-7);
    if(keys['ArrowRight'])hk.px=Math.min(W-30,hk.px+7);
    if(keys['Space'])hk.px+=(hk.bx-hk.px)*0.12;
    hk.bvy+=0.2;hk.bx+=hk.bvx;hk.by+=hk.bvy;
    if(hk.bx<10){hk.bx=10;hk.bvx=Math.abs(hk.bvx);}
    if(hk.bx>W-10){hk.bx=W-10;hk.bvx=-Math.abs(hk.bvx);}
    if(hk.by>H-42){hk.by=H-42;hk.bvy=-(5+Math.random());hk.combo=0;sfx.oof();}
    const dx=hk.bx-hk.px,dy=hk.by-(hk.py-18);
    if(Math.sqrt(dx*dx+dy*dy)<40&&hk.kickCD<=0&&hk.bvy>-1){
      hk.kickCD=0.26;
      hk.bvx=dx*0.3+(Math.random()-.5)*2;hk.bvy=-(7.5+Math.random()*2);
      hk.kicks++;hk.combo++;
      const t=['KICK!','DOUBLE!','TRIPLE!','QUAD!','KNEE!','HEADER!','SICK!','GNARLY!'];
      hk.trickText=t[Math.min(hk.combo-1,t.length-1)];
      hk.trickPts=hk.combo*10*player.bonus('hackySack')|0;
      hk.score+=hk.trickPts;hk.trickTimer=1.4;sfx.kick();
      // Trigger superpower on gnarly combo 10
      if(hk.combo>=10&&!pw.triggered){
        pw.triggered=true;pw.active=true;pw.timer=10;pw.auraT=0;
        pw.pvx=0;pw.pvy=0;pw.shootCD=0;pw.sacks=[];pw.birds=[];
        for(let i=0;i<10;i++){
          const e=i%4;
          const bx=e===0||e===2?Math.random()*W:e===1?W+30:-30;
          const by=e===0?-30:e===2?H+30:Math.random()*H;
          pw.birds.push({x:bx,y:by,vx:0,vy:0,ph:Math.random()*Math.PI*2,dead:false,deadT:0,feathers:[]});
        }
        hk.bonusTxt='SUPER SAIYAN MODE!';hk.bonusTxtT=3;sfx.score();
      }
    }
    // ── Seagull ──────────────────────────────────────────────────────────
    const g=hk.gull;
    g.wing+=dt*6;
    if(g.hit){
      g.hitT-=dt;
      g.feathers.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=0.15;f.life-=dt;});
      if(g.hitT<=0){g.active=false;g.spawnT=5+Math.random()*6;}
    } else if(g.active){
      g.x+=g.dir*g.spd;
      const gdx=hk.bx-g.x,gdy=hk.by-g.y;
      if(Math.sqrt(gdx*gdx+gdy*gdy)<24){
        g.hit=true;g.hitT=0.7;
        const difficulty=(90-hk.timer)/90;
        const pts=Math.floor((80+difficulty*170)*player.bonus('hackySack'));
        hk.drop={active:true,x:g.x,y:g.y,vy:-1,pts,rot:0};
        g.feathers=[];
        for(let i=0;i<8;i++)g.feathers.push({x:g.x,y:g.y,vx:(Math.random()-0.5)*4,vy:Math.random()*-3-1,life:1.2});
        sfx.score();
      }
      if((g.dir>0&&g.x>W+70)||(g.dir<0&&g.x<-70)){g.active=false;g.spawnT=5+Math.random()*7;}
    } else {
      g.spawnT-=dt;
      if(g.spawnT<=0){
        const difficulty=(90-hk.timer)/90;
        g.spd=1.5+difficulty*3.5+(Math.random()*0.8);
        g.dir=Math.random()<0.5?1:-1;
        g.x=g.dir>0?-60:W+60;
        g.y=52+Math.random()*80;
        g.active=true;g.hit=false;g.feathers=[];
      }
    }
    // ── Bonus drop ───────────────────────────────────────────────────────
    const db=hk.drop;
    if(db.active){
      db.vy+=0.25;db.y+=db.vy;db.rot+=0.1;
      const bdx=db.x-hk.px,bdy=db.y-(hk.py-20);
      if(Math.abs(bdx)<32&&Math.abs(bdy)<36){
        hk.score+=db.pts;hk.bonusTxt='SEAGULL! +'+db.pts;hk.bonusTxtT=2.2;
        db.active=false;sfx.score();
      }
      if(db.y>H-30)db.active=false;
    }
  }
}
function drawHackySack(){
  // Beach sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#5bc8f5');sky.addColorStop(0.55,'#ffe680');sky.addColorStop(1,'#f4d03f');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  [[0,68,38],[220,48,28],[430,82,33]].forEach(([ox,y,r])=>{
    const cx=((hk.bgO*.25+ox)%(W+100))-50;
    [0,20,40].forEach((d,i)=>{ctx.beginPath();ctx.arc(cx+d,y,r-i*4,0,Math.PI*2);ctx.fill();});
  });
  ctx.fillStyle='#1a7fbf';ctx.fillRect(0,H*.55,W,H*.1);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
  for(let w=0;w<3;w++){
    ctx.beginPath();
    for(let x=0;x<W;x+=4){
      const y=H*.57+w*10+Math.sin((x+hk.bgO*2+w*50)*.05)*5;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();}
  const sand=ctx.createLinearGradient(0,H*.65,0,H);
  sand.addColorStop(0,'#f5d060');sand.addColorStop(1,'#c9a93a');
  ctx.fillStyle=sand;ctx.fillRect(0,H*.65,W,H*.35);
  // Palm
  ctx.fillStyle='#7a4010';ctx.fillRect(W-74,H*.33,11,H*.34);
  ctx.fillStyle='#2d7a1a';
  [[W-68,H*.34,40],[W-80,H*.31,30],[W-56,H*.31,26]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#C8A400';ctx.fillRect(0,H-32,W,32);
  const pw=hk.power;
  const hero=player.hero;
  // Player shadow (ground only)
  if(!pw.active){
    ctx.fillStyle='rgba(0,0,0,0.12)';
    ctx.beginPath();ctx.ellipse(hk.px,H-72,22,5,0,0,Math.PI*2);ctx.fill();
  }
  // ── Super Saiyan aura ─────────────────────────────────────────────────────
  if(pw.active){
    const auraR=38+Math.sin(pw.auraT*8)*13;
    const ag=ctx.createRadialGradient(hk.px,hk.py-22,0,hk.px,hk.py-22,auraR+20);
    ag.addColorStop(0,'rgba(255,255,80,0.75)');ag.addColorStop(0.45,'rgba(255,200,0,0.35)');ag.addColorStop(1,'rgba(255,120,0,0)');
    ctx.fillStyle=ag;ctx.beginPath();ctx.arc(hk.px,hk.py-22,auraR+20,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,0,0.65)';ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const ang=(i/8)*Math.PI*2+pw.auraT*2.5;
      const len=22+Math.sin(pw.auraT*6+i*1.3)*14;
      ctx.beginPath();ctx.moveTo(hk.px+Math.cos(ang)*14,hk.py-22+Math.sin(ang)*14);
      ctx.lineTo(hk.px+Math.cos(ang)*(14+len),hk.py-22+Math.sin(ang)*(14+len));ctx.stroke();
    }
  }
  // ── Player body ───────────────────────────────────────────────────────────
  const kp2=hk.kickCD>0.14;
  if(pw.active){
    // Flying / Iron Man pose
    ctx.strokeStyle=hero.color;ctx.lineWidth=3;
    // Legs back-swept
    ctx.beginPath();ctx.moveTo(hk.px,hk.py-10);ctx.lineTo(hk.px-8,hk.py+16);ctx.lineTo(hk.px-6,hk.py+28);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hk.px,hk.py-10);ctx.lineTo(hk.px+8,hk.py+16);ctx.lineTo(hk.px+6,hk.py+28);ctx.stroke();
    ctx.fillStyle=hero.accent;ctx.fillRect(hk.px-9,hk.py-14,18,8);
    ctx.fillStyle=hero.color;
    ctx.beginPath();ctx.moveTo(hk.px-8,hk.py-14);ctx.lineTo(hk.px+8,hk.py-14);ctx.lineTo(hk.px+6,hk.py-32);ctx.lineTo(hk.px-6,hk.py-32);ctx.closePath();ctx.fill();
    // Arms forward (shooting)
    ctx.strokeStyle=hero.color;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(hk.px-8,hk.py-30);ctx.lineTo(hk.px-28,hk.py-38);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hk.px+8,hk.py-30);ctx.lineTo(hk.px+28,hk.py-38);ctx.stroke();
    // Gold palm blasters
    ctx.fillStyle='#ffdd00';ctx.beginPath();ctx.arc(hk.px-28,hk.py-38,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hk.px+28,hk.py-38,4,0,Math.PI*2);ctx.fill();
    const ssHero={...hero,hair:'#ffdd00',band:false,shades:false};
    drawHead(hk.px,hk.py-43,9,ssHero);
  } else {
    // Normal stance
    ctx.strokeStyle=hero.color;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(hk.px,hk.py-10);ctx.lineTo(hk.px-12,hk.py+8);ctx.lineTo(hk.px-14,hk.py+22);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hk.px,hk.py-10);
    if(kp2)ctx.lineTo(hk.px+24,hk.py-26);
    else{ctx.lineTo(hk.px+12,hk.py+8);ctx.lineTo(hk.px+14,hk.py+22);}
    ctx.stroke();
    ctx.fillStyle=hero.accent;ctx.fillRect(hk.px-9,hk.py-14,18,8);
    ctx.fillStyle=hero.color;
    ctx.beginPath();ctx.moveTo(hk.px-8,hk.py-14);ctx.lineTo(hk.px+8,hk.py-14);ctx.lineTo(hk.px+6,hk.py-32);ctx.lineTo(hk.px-6,hk.py-32);ctx.closePath();ctx.fill();
    ctx.strokeStyle=hero.color;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(hk.px-8,hk.py-30);ctx.lineTo(hk.px-17,hk.py-22);ctx.moveTo(hk.px+8,hk.py-30);ctx.lineTo(hk.px+17,hk.py-22);ctx.stroke();
    drawHead(hk.px,hk.py-43,9,hero);
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(hk.px,hk.py-18,40,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  }
  // ── Power birds ───────────────────────────────────────────────────────────
  if(pw.active){
    pw.birds.forEach(b=>{
      b.feathers.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#888';ctx.fillRect(f.x-2,f.y-3,4,8);});
      ctx.globalAlpha=1;
      if(b.dead)return;
      ctx.save();ctx.translate(b.x,b.y);
      const wf=Math.sin(b.ph)*9;
      ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(0,0,9,3.5,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#222';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-7,-1);ctx.quadraticCurveTo(-16,-7+wf*0.3,-22,-3-wf*0.2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(7,-1);ctx.quadraticCurveTo(16,-7+wf*0.3,22,-3-wf*0.2);ctx.stroke();
      ctx.fillStyle='#ff2200';ctx.beginPath();ctx.arc(7,-1,2.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    // Power sacks (glowing yellow)
    pw.sacks.forEach(s=>{
      ctx.fillStyle='rgba(255,255,0,0.25)';ctx.beginPath();ctx.arc(s.x-s.vx*2,s.y-s.vy*2,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(s.x,s.y,7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ff8800';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s.x,s.y,7,0,Math.PI*2);ctx.stroke();
    });
  }
  // ── Normal ball (hidden during power) ────────────────────────────────────
  if(!pw.active){
    ctx.fillStyle='#ff3300';ctx.beginPath();ctx.arc(hk.bx,hk.by,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(hk.bx-2,hk.by-2,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#880000';ctx.lineWidth=1;ctx.beginPath();ctx.arc(hk.bx,hk.by,8,0,Math.PI*2);ctx.stroke();
  }
  // Seagull
  const g=hk.gull;
  if(g.active){
    ctx.save();ctx.translate(g.x,g.y);
    if(g.dir<0)ctx.scale(-1,1);
    const wf=Math.sin(g.wing)*12;
    // Body
    ctx.fillStyle=g.hit?'#ff8800':'#f0f0f0';
    ctx.strokeStyle=g.hit?'#ff3300':'#aaaaaa';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,11,4,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    // Wings
    ctx.strokeStyle=g.hit?'#ff5500':'#cccccc';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-8,-1);ctx.quadraticCurveTo(-18,-10+wf*0.5,-26,-3-wf*0.3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,-1);ctx.quadraticCurveTo(18,-10+wf*0.5,26,-3-wf*0.3);ctx.stroke();
    // Head & beak
    ctx.fillStyle='#f0f0f0';ctx.beginPath();ctx.arc(10,-1,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(12,-2,1.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e8aa00';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(21,2);ctx.stroke();
    ctx.restore();
    // Feathers on hit
    g.feathers.forEach(f=>{
      ctx.globalAlpha=Math.max(0,f.life*0.9);
      ctx.fillStyle='#f0f0f0';ctx.fillRect(f.x-2,f.y-3,4,8);
    });
    ctx.globalAlpha=1;
    // Difficulty "!" indicator
    if(!g.hit){
      const lvl=Math.ceil((g.spd-1.5)/3.5*3);
      T('!'.repeat(Math.max(1,Math.min(3,lvl))),g.x,g.y-22,'#ffff00',8);
    }
  }
  // Bonus drop star
  const db=hk.drop;
  if(db.active){
    ctx.save();ctx.translate(db.x,db.y);ctx.rotate(db.rot);
    ctx.fillStyle='#ffff00';ctx.strokeStyle='#ff8800';ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2-Math.PI/2,ai=a+Math.PI/5;
      i===0?ctx.moveTo(Math.cos(a)*12,Math.sin(a)*12):ctx.lineTo(Math.cos(a)*12,Math.sin(a)*12);
      ctx.lineTo(Math.cos(ai)*5,Math.sin(ai)*5);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
    T('+'+db.pts,db.x,db.y-16,'#ffff00',7);
  }
  // Seagull bonus text
  if(hk.bonusTxtT>0){
    ctx.globalAlpha=Math.min(1,hk.bonusTxtT*0.9);
    T(hk.bonusTxt,W/2,H/2-60,'#ff8800',13);
    ctx.globalAlpha=1;
  }
  // HUD
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,38);
  T('SCORE: '+hk.score,14,26,player.color,9,'left');
  T('COMBO \xD7'+hk.combo,W/2,26,'#ffff00',9);
  T('TIME: '+hk.timer,W-14,26,hk.timer<=10?'#ff3300':'#fff',9,'right');
  if(hk.trickTimer>0){
    ctx.globalAlpha=Math.min(1,hk.trickTimer);
    T(hk.trickText,W/2,H/2-28,'#ffff00',16);
    T('+'+hk.trickPts+' pts',W/2,H/2+4,'#00ff88',10);
    ctx.globalAlpha=1;
  }
  if(pw.active){
    const bw=160,bh=9,bx=W/2-80,by=H-22;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    const frac=Math.max(0,pw.timer/10);
    const barCol=frac>0.4?'#ffdd00':'#ff4400';
    ctx.fillStyle=barCol;ctx.fillRect(bx,by,bw*frac,bh);
    T('⚡ SUPER MODE  ←→↑↓ FLY   SPACE = SHOOT',W/2,H-5,'rgba(255,255,0,0.7)',7);
  } else {
    T('←→ MOVE   SPACE CHASE BALL   Walk into it to kick!',W/2,H-5,'rgba(255,255,255,0.4)',7);
  }
  if(hk.phase==='end')drawEnd('TIME\'S UP!',hk.score,'KICKS: '+hk.kicks,'#00ff88',HS.hackySack);
}

// ══════════════════════════════════════════════════════════════════════════════
// HALF-PIPE  — L/R pump, U-shaped pipe, real air time off lips
// ══════════════════════════════════════════════════════════════════════════════
const PL=18,PR=W-18,PTOP=110,PBOT=H-8;
function pipeY(x){
  const nx=(x-PL)/(PR-PL);
  const u=2*Math.abs(nx-0.5);             // 0 at centre, 1 at edges
  return PBOT-(PBOT-PTOP)*Math.pow(u,1.6);// U-shape: steep walls, curved base
}
let hp={};
function initHalfpipe(){
  hp={
    angle:0.05,angVel:0.04,
    inAir:false,airX:0,airY:0,airVX:0,airVY:0,airSpin:0,
    airRotAccum:0,air360s:0,
    flipInProgress:false,flipRot:0,flipDir:0,flipsCompleted:0,boardFlipRot:0,
    crashed:false,crashTimer:0,
    sx:0,sy:0,wheelRot:0,bgScroll:0,
    score:0,timer:45,timerFrac:0,phase:'play',
    airTricks:new Set(),airTrickText:'',airTrickPts:0,
    trickText:'',trickTimer:0,trickPts:0,totalTricks:0,combo:0,
    speedBar:0,
  };
  hp.sx=W/2;hp.sy=pipeY(hp.sx)-20;
}
const HP_TRICKS={
  'KeyA':{name:'GRIND',    pts:200},
  'KeyS':{name:'360 FLIP', pts:350},
  'KeyD':{name:'KICKFLIP', pts:250},
  'KeyW':{name:'AIR WALK', pts:300},
};
function updateHalfpipe(dt){
  if(hp.phase==='end'){if(kp['Enter'])state='menu';return;}
  hp.timerFrac+=dt;
  if(hp.timerFrac>=1){hp.timerFrac-=1;hp.timer--;
    if(hp.timer<=0){hp.phase='end';saveHS('halfpipe',hp.score);sfx.score();return;}}
  if(hp.trickTimer>0)hp.trickTimer-=dt;
  hp.bgScroll+=Math.abs(hp.inAir?hp.airVX:hp.angVel)*30;

  // Crash recovery — skater gets up after wipeout delay
  if(hp.crashed){
    hp.crashTimer-=dt;
    if(hp.crashTimer<=0){hp.crashed=false;hp.angle=0.05;hp.angVel=0.04;}
    return;
  }

  if(hp.inAir){
    // Reduced gravity for visible hang time
    hp.airVY+=0.22;
    hp.airX+=hp.airVX;
    hp.airY+=hp.airVY;

    // SPACE + ↑ = backflip,  SPACE + ↓ = frontflip
    if(keys['Space']){
      if(kp['ArrowUp']&&!hp.flipInProgress){hp.flipInProgress=true;hp.flipDir=1;hp.flipRot=0;hp.flipsCompleted=0;}
      if(kp['ArrowDown']&&!hp.flipInProgress){hp.flipInProgress=true;hp.flipDir=-1;hp.flipRot=0;hp.flipsCompleted=0;}
    }
    if(hp.flipInProgress){
      hp.boardFlipRot+=hp.flipDir*0.21;
      hp.flipRot+=hp.flipDir*0.21;
      const flipDone=Math.floor(Math.abs(hp.flipRot)/(Math.PI*2));
      if(flipDone>hp.flipsCompleted){
        hp.flipsCompleted=flipDone;
        const pts=380*flipDone*(1+hp.combo)*player.bonus('halfpipe')|0;
        hp.airTrickPts+=pts;
        hp.airTrickText=(flipDone>1?flipDone+'× ':'')+(hp.flipDir>0?'BACKFLIP':'FRONTFLIP');
        hp.trickText=hp.airTrickText;hp.trickPts=hp.airTrickPts;hp.trickTimer=1.5;
        sfx.score();
      }
    }

    // ←→ body spin (360s)
    if(keys['ArrowLeft']) hp.airSpin-=0.07;
    if(keys['ArrowRight'])hp.airSpin+=0.07;
    hp.airSpin+=hp.airVX*0.02;
    hp.airSpin*=0.96;
    hp.airRotAccum+=Math.abs(hp.airSpin);
    const done360=Math.floor(hp.airRotAccum/(Math.PI*2));
    if(done360>hp.air360s){
      hp.air360s=done360;
      const pts360=280*done360*player.bonus('halfpipe')|0;
      hp.airTrickPts+=pts360;
      hp.airTrickText=(done360>1?done360+'× ':'')+'360!';
      hp.trickText=hp.airTrickText;hp.trickPts=hp.airTrickPts;hp.trickTimer=1.4;
      sfx.score();
    }
    // A/S/D/W grab tricks (each fires once per air)
    for(const [k,t] of Object.entries(HP_TRICKS)){
      if(kp[k]&&!hp.airTricks.has(t.name)){
        hp.airTricks.add(t.name);
        const pts=t.pts*player.bonus('halfpipe')|0;
        hp.airTrickPts+=pts;
        hp.airTrickText=hp.airTricks.size>1?hp.airTrickText+' + '+t.name:t.name;
        hp.trickText=hp.airTrickText;hp.trickPts=hp.airTrickPts;hp.trickTimer=1.6;
        sfx.score();
      }
    }

    // Landing: only when falling downward AND back on pipe surface
    const clampX=Math.max(PL+8,Math.min(PR-8,hp.airX));
    const surfY=pipeY(clampX);
    if(hp.airVY>=0&&hp.airY>=surfY-20){
      // Crash if flip was started but not completed (>30% through a rotation)
      const badLand=hp.flipInProgress&&hp.flipsCompleted===0&&Math.abs(hp.flipRot%(Math.PI*2))>Math.PI*0.3;
      if(badLand){
        hp.inAir=false;hp.crashed=true;hp.crashTimer=1.8;
        hp.sx=clampX;hp.sy=surfY-20;
        hp.angle=Math.max(-0.85,Math.min(0.85,(clampX-W/2)/((PR-PL)/2.0)));
        hp.angVel=0;
        hp.score=Math.max(0,hp.score-150);
        hp.airTricks.clear();hp.airTrickPts=0;hp.airTrickText='';
        hp.flipInProgress=false;hp.flipRot=0;hp.boardFlipRot=0;hp.flipsCompleted=0;
        sfx.oof();
      } else {
        hp.inAir=false;
        hp.sx=clampX;hp.sy=surfY-20;
        const nx=(clampX-W/2)/((PR-PL)/2.0);
        hp.angle=Math.max(-0.9,Math.min(0.9,nx));
        hp.angVel=(hp.airVX>0?1:-1)*Math.min(Math.abs(hp.airVX)*0.12,0.55);
        hp.wheelRot=0;
        if(hp.airTrickPts>0){
          hp.score+=hp.airTrickPts;
          hp.totalTricks+=hp.airTricks.size+(hp.flipsCompleted>0?hp.flipsCompleted:0);
          hp.combo++;
        }
        hp.airTricks.clear();hp.airTrickPts=0;hp.airTrickText='';
        hp.flipInProgress=false;hp.flipRot=0;hp.boardFlipRot=0;hp.flipsCompleted=0;
      }
    }
    // Fell off screen — soft reset
    if(hp.airY>H+60||hp.airX<PL-80||hp.airX>PR+80){
      hp.inAir=false;hp.angle=0;hp.angVel=0.04;
      hp.airTricks.clear();hp.airTrickPts=0;
      hp.flipInProgress=false;hp.flipRot=0;hp.boardFlipRot=0;
    }
    return;
  }

  // ── Ground pendulum ──
  hp.angVel+=-0.055*hp.angle;   // gravity restoring force
  hp.angVel*=0.994;             // rolling friction
  hp.wheelRot+=hp.angVel*8;

  // PUMP: press the direction you are travelling at the bottom transition zone
  // Uses an additive boost so even a small angVel gets a real kick
  const atTransition=Math.abs(hp.angle)<0.48;
  if(atTransition&&((hp.angVel<0&&keys['ArrowLeft'])||(hp.angVel>0&&keys['ArrowRight']))){
    const boost=0.08+Math.abs(hp.angVel)*0.10;
    hp.angVel+=Math.sign(hp.angVel)*boost;
    hp.angVel=Math.sign(hp.angVel)*Math.min(Math.abs(hp.angVel),3.4);
    hp.speedBar=Math.min(1,hp.speedBar+0.12);
  }
  hp.speedBar=Math.max(0,hp.speedBar-dt*0.28);
  hp.angle+=hp.angVel;

  // Lip check — any time the skater reaches the lip, launch into air
  if(Math.abs(hp.angle)>=0.90){
    const dir=Math.sign(hp.angle);
    const spd=Math.abs(hp.angVel);
    hp.inAir=true;
    hp.airX=hp.sx;hp.airY=hp.sy;
    hp.airVX=dir*Math.min(spd,0.8)*0.25;  // mostly straight up, not sideways
    hp.airVY=-(5+spd*8);                   // strong upward launch
    hp.airSpin=0;hp.airRotAccum=0;hp.air360s=0;
    hp.airTricks.clear();hp.airTrickPts=0;hp.airTrickText='';
    hp.angle=dir*0.89;hp.angVel=0;
  }

  hp.sx=W/2+hp.angle*(PR-PL)/2.0;
  hp.sy=pipeY(hp.sx)-20;
}
function drawHalfpipe(){
  // Night city sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#070018');sky.addColorStop(0.55,'#1a0035');sky.addColorStop(1,'#320008');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='#fff';
  for(let i=0;i<28;i++){
    const sx=(i*73+hp.bgScroll*.03)%W,sy=(i*41)%(PTOP-4);
    ctx.fillRect(sx,sy,i%5===0?2:1,1);
  }
  // Neon buildings
  const cc=['#ff00ff44','#00ffff44','#ff660044','#00ff0044'];
  for(let i=0;i<9;i++){
    const bx=((i*90-hp.bgScroll*.16)%(W+100))-50;
    const bh=40+(i*37)%65,bw=48;
    ctx.fillStyle=cc[i%4];ctx.fillRect(bx,PTOP-bh,bw,bh);
    ctx.fillStyle='#ffff0055';
    for(let wr=0;wr<3;wr++)for(let wc=0;wc<Math.floor(bh/14);wc++){
      if((i+wr+wc)%3!==0)ctx.fillRect(bx+6+wr*13,PTOP-bh+3+wc*13,7,7);
    }
  }
  // Pipe fill
  ctx.fillStyle='#2e2e2e';
  ctx.beginPath();ctx.moveTo(PL,PTOP);
  for(let x=PL;x<=PR;x+=2)ctx.lineTo(x,pipeY(x));
  ctx.lineTo(PR,PTOP);ctx.closePath();ctx.fill();
  // Pipe sheen stripe
  ctx.strokeStyle='#888';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(PL,PTOP);
  for(let x=PL;x<=PR;x+=2)ctx.lineTo(x,pipeY(x)-2);
  ctx.stroke();
  // Grid lines on surface
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
  for(let x=PL+55;x<PR;x+=55){
    ctx.beginPath();ctx.moveTo(x,pipeY(x)-7);ctx.lineTo(x,pipeY(x)+7);ctx.stroke();
  }
  // Coping blocks at lips
  ctx.fillStyle='#bbb';
  ctx.fillRect(PL-4,PTOP-8,14,8);ctx.fillRect(PR-10,PTOP-8,14,8);

  // Speed bar (top-left)
  ctx.fillStyle='#111';ctx.fillRect(10,10,90,8);
  ctx.fillStyle=hp.speedBar>0.7?'#ff4400':hp.speedBar>0.4?'#ffaa00':'#00ff88';
  ctx.fillRect(10,10,90*hp.speedBar,8);
  ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(10,10,90,8);
  T('SPEED',55,9,'#555',5);

  // Hint bar
  if(hp.inAir){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(W/2-240,H-46,480,20);
    if(hp.flipInProgress)T('COMPLETE THE FLIP! (land halfway = CRASH)',W/2,H-31,'#ff6600',7);
    else T('SPACE+↑ BACKFLIP   SPACE+↓ FRONTFLIP   ←→ SPIN   A/S/D/W GRAB',W/2,H-31,'#ffff00',7);
  }

  // ── Draw skater ──
  const sx=hp.crashed?hp.sx:hp.inAir?hp.airX:hp.sx;
  const sy=hp.crashed?hp.sy:hp.inAir?hp.airY:hp.sy;

  if(hp.crashed){
    // Crash: skater sprawled sideways with dizziness stars
    ctx.save();ctx.translate(sx,sy+8);
    ctx.rotate(Math.PI*0.55);  // tipped over
    const bColC=EQUIP.halfpipe[player.equip.halfpipe].col;
    ctx.fillStyle=bColC;ctx.fillRect(-17,10,34,6);
    ctx.strokeStyle=player.color;ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-6,8);ctx.lineTo(0,-4);ctx.lineTo(6,8);
    ctx.moveTo(-14,-2);ctx.lineTo(0,-10);ctx.lineTo(14,-2);ctx.stroke();
    ctx.fillStyle=player.color;ctx.beginPath();ctx.arc(0,-18,7,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Dizzy stars
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2+hp.crashTimer*10;
      ctx.fillStyle=i%2===0?'#ffff00':'#ff6600';
      ctx.fillRect(sx+Math.cos(a)*16-2,sy-14+Math.sin(a)*10-2,4,4);
    }
    T('BAILED!',sx,sy-32,'#ff2200',12);
  } else {
    // Body follows airSpin only; board flips independently on boardFlipRot
    const bodyAngle=hp.inAir?hp.airSpin:Math.atan2(pipeY(sx+5)-pipeY(sx-5),10);
    ctx.save();ctx.translate(sx,sy);ctx.rotate(bodyAngle);
    // Body (legs, torso, arms, head)
    const hero=player.hero;
    // Legs
    ctx.strokeStyle=hero.color;ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-6,9);ctx.lineTo(-5,0);
    ctx.moveTo(6,9);ctx.lineTo(5,0);
    ctx.stroke();
    // Shorts
    ctx.fillStyle=hero.accent;ctx.fillRect(-8,-2,16,7);
    // Torso
    ctx.fillStyle=hero.color;
    ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(7,-2);ctx.lineTo(5,-14);ctx.lineTo(-5,-14);ctx.closePath();ctx.fill();
    // Arms
    const aw=hp.inAir?20:13;
    ctx.strokeStyle=hero.color;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-aw,-4);ctx.lineTo(-5,-12);ctx.moveTo(aw,-4);ctx.lineTo(5,-12);ctx.stroke();
    drawHead(0,-21,7,hero);
    // Board — rotates around its own centre when flipping
    const bCol=EQUIP.halfpipe[player.equip.halfpipe].col;
    ctx.save();ctx.translate(0,14);ctx.rotate(hp.flipInProgress?hp.boardFlipRot:0);
    ctx.fillStyle=bCol;ctx.fillRect(-17,-2,34,6);
    ctx.fillStyle=bCol+'88';ctx.fillRect(-14,-5,28,4);
    ctx.strokeStyle='#222';ctx.lineWidth=2;
    [-10,10].forEach(wx=>{
      ctx.beginPath();ctx.arc(wx,4,4,0,Math.PI*2);ctx.stroke();
      for(let s=0;s<4;s++){
        const a=s*Math.PI/2+hp.wheelRot;
        ctx.beginPath();ctx.moveTo(wx,4);ctx.lineTo(wx+Math.cos(a)*3,4+Math.sin(a)*3);ctx.stroke();
      }
    });
    ctx.restore(); // board
    ctx.restore(); // body
    // Flip progress arc (shows how far through the rotation)
    if(hp.inAir&&hp.flipInProgress){
      const pct=Math.abs(hp.flipRot%(Math.PI*2))/(Math.PI*2);
      const arcCol=pct>0.75?'#00ff88':pct>0.4?'#ffaa00':'#ff3300';
      ctx.strokeStyle=arcCol;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(sx,sy-28,12,-(Math.PI/2),-(Math.PI/2)+pct*Math.PI*2);ctx.stroke();
    }
  }

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,34);
  T('SCORE: '+hp.score,14,22,player.color,9,'left');
  T('TRICKS: '+hp.totalTricks,W/2,22,'#ff00ff',9);
  T('TIME: '+hp.timer,W-14,22,hp.timer<=10?'#ff3300':'#fff',9,'right');
  if(hp.trickTimer>0){
    ctx.globalAlpha=Math.min(1,hp.trickTimer);
    T(hp.trickText+'!',W/2,H/2-20,'#ffff00',15);
    T('+'+hp.trickPts+' pts',W/2,H/2+8,'#00ff88',10);
    ctx.globalAlpha=1;
  }
  if(!hp.inAir&&!hp.crashed)T('← → pump at bottom   build speed to launch   ESC=Menu',W/2,H-5,'rgba(255,255,255,0.28)',6);
  if(hp.phase==='end')drawEnd('SESSION OVER!',hp.score,'TRICKS: '+hp.totalTricks,'#00ffff',HS.halfpipe);
}

// ══════════════════════════════════════════════════════════════════════════════
// SURFING  — barrel ride: paddle in, time directions to stay in the tube
// ══════════════════════════════════════════════════════════════════════════════
let sf={};
function initSurfing(){
  sf={
    surferY:H*0.5, surferVY:0,
    rideX:0.0, rideVX:0.0,          // -1=behind barrel, 0=sweet spot, +1=ahead
    barrelY:H*0.44, barrelR:52,
    wt:0, bgScroll:0,
    cue:null, cueTimer:0, cueInterval:1.8, cueSuccess:false,
    inBarrel:false, outTimer:0,
    wipeout:false, wipeTimer:0, wipeX:0, wipeY:0,
    score:0, timer:45, timerFrac:0, phase:'play',
    trickText:'', trickTimer:0, combo:0,
    dolphins:[{x:W+60,y:0,ph:0},{x:W+260,y:0,ph:1.5}],
    birds:[{x:80,y:55,ph:0},{x:260,y:40,ph:.7},{x:450,y:70,ph:1.4}],
    aerial:{active:false,t:0,totalT:1.3,launchY:0,sy:0,rot:0,rotVel:0,spins:0,maxH:80},
    shark:{spawnT:15,active:false,x:0,y:0,vx:0,vy:0,phase:'idle',chaseT:0,evadeT:0,warnT:0,_evadedScored:false},
    bonusTxt:'',bonusTxtT:0,
  };
}
function updateSurfing(dt){
  if(sf.phase==='end'){if(kp['Enter'])state='menu';return;}
  sf.timerFrac+=dt;
  if(sf.timerFrac>=1){sf.timerFrac-=1;sf.timer--;
    if(sf.timer<=0){sf.phase='end';saveHS('surfing',Math.floor(sf.score));sfx.score();return;}}
  sf.wt+=dt; sf.bgScroll+=3.8;
  if(sf.trickTimer>0)sf.trickTimer-=dt;
  if(sf.bonusTxtT>0)sf.bonusTxtT-=dt;

  if(sf.wipeout){
    sf.wipeTimer-=dt;
    if(sf.wipeTimer<=0){sf.wipeout=false;sf.surferY=H*0.5;sf.surferVY=0;sf.rideX=0;sf.rideVX=0;sf.outTimer=0;sf.combo=0;}
  } else {
    const tBarY=H*0.42+Math.sin(sf.wt*0.72)*62+Math.sin(sf.wt*1.5)*26;
    sf.barrelY+=(tBarY-sf.barrelY)*0.055;
    const tR=50+Math.sin(sf.wt*0.85)*13+Math.sin(sf.wt*2.2)*7;
    sf.barrelR+=(tR-sf.barrelR)*0.05;

    const air=sf.aerial;
    if(air.active){
      // ── AIRBORNE ──
      air.t+=dt;
      const frac=air.t/air.totalT;
      air.sy=air.launchY-Math.sin(frac*Math.PI)*air.maxH;
      if(keys['ArrowLeft'])  air.rotVel-=9*dt;
      if(keys['ArrowRight']) air.rotVel+=9*dt;
      air.rotVel*=0.91;
      air.rot+=air.rotVel;
      air.spins=Math.floor(Math.abs(air.rot)/(Math.PI*2));
      sf.outTimer=0;
      if(air.t>=air.totalT){
        const ang=((air.rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
        const clean=ang<0.69||ang>Math.PI*2-0.69;
        air.active=false;
        if(clean){
          const spinNames=['AIR!','360!','720!','1080!'];
          const pts=(150+air.spins*220)*player.bonus('surfing')|0;
          sf.score+=pts;sf.combo++;
          sf.trickText=spinNames[Math.min(air.spins,3)]||'HUGE AIR!';
          sf.trickTimer=1.5;sfx.score();
        } else {
          sf.wipeout=true;sf.wipeTimer=2.2;
          sf.wipeX=W*0.38+sf.rideX*55;sf.wipeY=sf.surferY;
          sf.combo=Math.max(0,sf.combo-1);sfx.oof();
        }
      }
    } else {
      // ── NORMAL MOVEMENT ──
      if(keys['ArrowUp'])   sf.surferVY-=340*dt;
      if(keys['ArrowDown']) sf.surferVY+=340*dt;
      sf.surferVY*=0.88;
      sf.surferY+=sf.surferVY*dt;
      sf.surferY=Math.max(H*0.1,Math.min(H*0.84,sf.surferY));
      if(keys['ArrowLeft'])  sf.rideVX-=1.52*dt;
      if(keys['ArrowRight']) sf.rideVX+=1.18*dt;
      sf.rideVX*=0.90;
      sf.rideX+=sf.rideVX+0.22*dt;
      sf.rideX=Math.max(-1.4,Math.min(1.4,sf.rideX));

      // Aerial launch: near lip + moving upward + Space
      if(kp['Space']&&sf.surferY<H*0.44&&sf.surferVY<-20){
        air.active=true;air.t=0;air.totalT=1.3+Math.random()*0.2;
        air.launchY=sf.surferY;air.sy=sf.surferY;
        air.rot=0;air.rotVel=0;air.spins=0;air.maxH=72+Math.random()*28;
        sfx.jump();
      }

      // Direction cue system
      sf.cueInterval-=dt;
      if(sf.cueInterval<=0&&!sf.cue){
        const barrelDY=sf.barrelY-sf.surferY;
        if(Math.abs(barrelDY)>20) sf.cue=barrelDY>0?'ArrowDown':'ArrowUp';
        else sf.cue=sf.rideX<-0.2?'ArrowLeft':'ArrowRight';
        sf.cueTimer=1.7;sf.cueSuccess=false;
        sf.cueInterval=1.5+Math.random()*1.4;
      }
      if(sf.cue){
        sf.cueTimer-=dt;
        if(kp[sf.cue]){
          sf.cueSuccess=true;
          const pts=90*(sf.combo+1)*player.bonus('surfing')|0;
          sf.score+=pts;sf.combo++;
          sf.trickText=['PUMP!','TOP TURN!','BOTTOM TURN!','SNAP!'][['ArrowLeft','ArrowUp','ArrowDown','ArrowRight'].indexOf(sf.cue)];
          sf.trickTimer=1.2;sfx.score();
        }
        if(sf.cueTimer<=0||sf.cueSuccess){if(!sf.cueSuccess)sf.combo=Math.max(0,sf.combo-1);sf.cue=null;}
      }

      const dy=sf.surferY-sf.barrelY;
      const dx=sf.rideX*75;
      sf.inBarrel=Math.sqrt(dx*dx+dy*dy)<sf.barrelR*1.01;
      if(sf.inBarrel){
        sf.score+=22*dt*player.bonus('surfing')*(1+sf.combo*0.28);
        sf.outTimer=0;
      } else {
        sf.outTimer+=dt;
        if(sf.outTimer>3.5){sf.wipeout=true;sf.wipeTimer=2.2;sf.wipeX=W*0.38+sf.rideX*55;sf.wipeY=sf.surferY;sf.outTimer=0;sfx.oof();}
      }
    }
  }

  // ── SHARK ──
  const sh=sf.shark;
  if(sh.warnT>0)sh.warnT-=dt;
  if(!sh.active){
    sh.spawnT-=dt;
    if(sh.spawnT<=0){
      sh.active=true;sh.phase='approach';sh.chaseT=0;sh._evadedScored=false;
      sh.x=W+80;sh.y=H*0.73;sh.vx=-2.2;sh.vy=0;sh.evadeT=0;
    }
  } else {
    sh.chaseT+=dt;
    const surX=W*0.38+sf.rideX*55,surY=sf.surferY;
    if(sh.phase==='approach'){
      sh.x+=sh.vx;sh.y+=(H*0.73-sh.y)*0.04;
      if(sh.x<W*0.72){sh.phase='chase';sh.warnT=2.8;}
    } else if(sh.phase==='chase'){
      const ddx=surX-sh.x,ddy=surY-sh.y;
      const dist=Math.sqrt(ddx*ddx+ddy*ddy);
      const spd=3+Math.min(sh.chaseT*0.5,4);
      if(dist>1){sh.vx+=(ddx/dist)*spd*dt*5;sh.vy+=(ddy/dist)*spd*dt*5;}
      sh.vx*=0.91;sh.vy*=0.91;sh.x+=sh.vx;sh.y+=sh.vy;
      sh.y=Math.max(H*0.58,sh.y);
      const air=sf.aerial;
      if(air.active&&dist<240){sh.phase='retreat';sh.evadeT=1;}
      if(!sf.wipeout&&!air.active&&dist<35){
        sf.wipeout=true;sf.wipeTimer=2.6;
        sf.wipeX=sh.x;sf.wipeY=sh.y;
        sf.combo=Math.max(0,sf.combo-2);sfx.oof();
        sh.active=false;sh.spawnT=18+Math.random()*6;
      }
      if(dist>190){sh.evadeT+=dt;if(sh.evadeT>2.5)sh.phase='retreat';}
      else sh.evadeT=Math.max(0,sh.evadeT-dt*0.5);
      if(sh.chaseT>10)sh.phase='retreat';
    } else if(sh.phase==='retreat'){
      sh.vx+=(3-sh.vx)*dt*2;sh.vy*=0.88;
      sh.x+=sh.vx;sh.y+=sh.vy;
      if(!sh._evadedScored&&sh.evadeT>0){
        sh._evadedScored=true;
        const pts=Math.floor(280*player.bonus('surfing'));
        sf.score+=pts;sf.combo++;
        sf.bonusTxt='SHARK EVADED! +'+pts;sf.bonusTxtT=2.8;sfx.score();
      }
      if(sh.x>W+100){sh.active=false;sh.spawnT=15+Math.random()*7;}
    }
  }

  sf.dolphins.forEach(d=>{d.x-=4.2;d.ph+=dt*3;d.y=H*.77+Math.sin(d.ph)*15;if(d.x<-50)d.x=W+60+Math.random()*180;});
  sf.birds.forEach(b=>{b.x-=2;b.ph+=dt*2.7;b.y=50+Math.sin(b.ph)*17+sf.birds.indexOf(b)*26;if(b.x<-30)b.x=W+Math.random()*110;});
}
function drawSurfing(){
  // Warm tropical sky
  const sky=ctx.createLinearGradient(0,0,0,H*0.62);
  sky.addColorStop(0,'#ff6a00');sky.addColorStop(0.4,'#ee3a00');sky.addColorStop(0.8,'#ff9040');sky.addColorStop(1,'#ffd068');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.62);
  // Sun
  ctx.fillStyle='#ffee8822';ctx.beginPath();ctx.arc(W*0.1,H*0.18,56,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffee44';ctx.beginPath();ctx.arc(W*0.1,H*0.18,20,0,Math.PI*2);ctx.fill();
  // Birds
  sf.birds.forEach(b=>{
    ctx.strokeStyle='#33221199';ctx.lineWidth=1.5;
    const bw=Math.sin(b.ph)*6;
    ctx.beginPath();ctx.moveTo(b.x-9,b.y-bw);ctx.lineTo(b.x,b.y);ctx.lineTo(b.x+9,b.y-bw);ctx.stroke();
  });
  // Ocean base
  ctx.fillStyle='#005577';ctx.fillRect(0,H*0.58,W,H*0.42);
  // Ocean glints
  for(let i=0;i<10;i++){
    const gx=((i*91+sf.bgScroll*0.38)%(W+40))-20;
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(gx,H*0.65+((i*53)%70),18+(i%4)*7,2);
  }

  // ── WAVE BODY ──
  const bcy=sf.barrelY, bcr=sf.barrelR;
  ctx.fillStyle='#006688';
  ctx.beginPath();
  ctx.moveTo(W,H);ctx.lineTo(W,H*0.06);
  ctx.bezierCurveTo(W*0.82,H*0.03,W*0.64,bcy-bcr*1.7,W*0.5,bcy-bcr*1.15);
  ctx.bezierCurveTo(W*0.36,bcy-bcr*0.25,W*0.22,bcy+bcr*0.9,W*0.08,H*0.7);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  // Wave face lighter overlay
  ctx.fillStyle='rgba(0,200,255,0.2)';
  ctx.beginPath();
  ctx.moveTo(W*0.08,H*0.7);
  ctx.bezierCurveTo(W*0.22,bcy+bcr*0.9,W*0.36,bcy-bcr*0.25,W*0.5,bcy-bcr*1.15);
  ctx.bezierCurveTo(W*0.44,bcy-bcr*0.65,W*0.32,bcy+bcr*0.6,W*0.1,H*0.68);
  ctx.closePath();ctx.fill();

  // Foam lip
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(W,H*0.08);
  ctx.bezierCurveTo(W*0.82,H*0.03,W*0.64,bcy-bcr*1.7,W*0.5,bcy-bcr*1.15);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<7;i++){
    const ft=(i/6);
    const fx=W*0.5+(ft)*(W*0.5);
    const fy=bcy-bcr*1.15-(ft)*(bcy-bcr*1.15-H*0.08)+Math.sin(sf.wt*2.2+i)*7;
    ctx.beginPath();ctx.arc(fx,fy,3+i%3*2.5,0,Math.PI*2);ctx.fill();
  }

  // ── BARREL TUBE ──
  const barX=W*0.4+sf.rideX*55;
  const bgr=ctx.createRadialGradient(barX,bcy,0,barX,bcy,bcr);
  bgr.addColorStop(0,'rgba(0,8,28,0.9)');bgr.addColorStop(0.6,'rgba(0,35,72,0.65)');bgr.addColorStop(1,'rgba(0,90,140,0.12)');
  ctx.fillStyle=bgr;ctx.beginPath();ctx.ellipse(barX,bcy,bcr*0.72,bcr,0,0,Math.PI*2);ctx.fill();
  // Ring
  ctx.strokeStyle=sf.inBarrel?'rgba(0,255,180,0.8)':'rgba(255,255,255,0.4)';
  ctx.lineWidth=sf.inBarrel?3.5:2;
  ctx.beginPath();ctx.ellipse(barX,bcy,bcr*0.72,bcr,0,0,Math.PI*2);ctx.stroke();
  if(sf.inBarrel){
    ctx.strokeStyle='rgba(0,255,180,0.25)';ctx.lineWidth=9;
    ctx.beginPath();ctx.ellipse(barX,bcy,bcr*0.72+7,bcr+7,0,0,Math.PI*2);ctx.stroke();
  }

  // ── DIRECTION CUE ──
  if(sf.cue&&sf.cueTimer>0){
    const arrowMap={'ArrowLeft':'←','ArrowRight':'→','ArrowUp':'↑','ArrowDown':'↓'};
    const urgCol=sf.cueTimer<0.55?'#ff3300':sf.cueTimer<1.0?'#ffaa00':'#00ff88';
    ctx.globalAlpha=Math.min(1,sf.cueTimer*1.6);
    T(arrowMap[sf.cue],W/2,H*0.28,urgCol,28);
    ctx.globalAlpha=1;
  }

  // Dolphins
  sf.dolphins.forEach(d=>{
    if(d.x<-30||d.x>W+30)return;
    ctx.fillStyle='#1e5566';ctx.beginPath();ctx.ellipse(d.x,d.y,15,5,Math.sin(d.ph)*0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(d.x-3,d.y-5);ctx.lineTo(d.x+4,d.y-14);ctx.lineTo(d.x+8,d.y-5);ctx.fill();
  });

  // ── SHARK ──
  {
    const sh=sf.shark;
    if(sh.active){
      const ang=Math.atan2(sh.vy,sh.vx)||0;
      ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(ang);
      ctx.fillStyle='#2e4050';
      ctx.beginPath();ctx.ellipse(0,0,34,10,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(-4,-10);ctx.lineTo(6,-30);ctx.lineTo(18,-10);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(4,8);ctx.lineTo(22,20);ctx.lineTo(14,10);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(-50,-16);ctx.lineTo(-50,16);ctx.closePath();ctx.fill();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(26,-3,3.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(27,-4,1.2,0,Math.PI*2);ctx.fill();
      const sdx=sh.x-(W*0.38+sf.rideX*55),sdy=sh.y-sf.surferY;
      if(Math.sqrt(sdx*sdx+sdy*sdy)<140){
        ctx.fillStyle='#eee';
        for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(18+i*4,4);ctx.lineTo(20+i*4,11);ctx.lineTo(22+i*4,4);ctx.closePath();ctx.fill();}
      }
      ctx.restore();
    }
    if(sh.warnT>0){ctx.globalAlpha=Math.min(1,sh.warnT);T('⚠ SHARK!',W/2,H*0.44,'#ff1100',20);ctx.globalAlpha=1;}
  }

  // ── SURFER ──
  const _surX=W*0.38+sf.rideX*55;
  if(!sf.wipeout){
    const surX=_surX;
    const bCol=EQUIP.surfing[player.equip.surfing].col;
    const hero=player.hero;
    const air=sf.aerial;
    if(air.active){
      ctx.save();ctx.translate(surX,air.sy);ctx.rotate(air.rot);
      ctx.fillStyle=bCol;ctx.beginPath();ctx.ellipse(0,10,32,6,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,10,32,6,0,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=hero.accent;ctx.fillRect(-6,1,12,7);
      ctx.fillStyle=hero.color;ctx.beginPath();ctx.moveTo(-6,1);ctx.lineTo(6,1);ctx.lineTo(4,-11);ctx.lineTo(-4,-11);ctx.closePath();ctx.fill();
      ctx.strokeStyle=hero.color;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(-4,-10);ctx.moveTo(14,-4);ctx.lineTo(4,-10);ctx.stroke();
      drawHead(0,-18,7,hero);
      ctx.restore();
      if(air.spins>0)T(air.spins+'\xd7 SPIN!',surX,air.sy-36,'#ffff00',10);
      T('← → SPIN',surX,H*0.28,'rgba(255,255,100,0.6)',7);
    } else {
      const surY=sf.surferY;
      const tilt=sf.surferVY*0.004+sf.rideVX*0.28;
      ctx.save();ctx.translate(surX,surY);ctx.rotate(tilt);
      ctx.fillStyle=bCol;ctx.beginPath();ctx.ellipse(0,11,32,6,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,11,32,6,0,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=hero.color;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-7,7);ctx.lineTo(-5,0);ctx.moveTo(7,7);ctx.lineTo(5,0);ctx.stroke();
      ctx.fillStyle=hero.accent;ctx.fillRect(-8,-2,16,7);
      ctx.fillStyle=hero.color;
      ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(7,-2);ctx.lineTo(5,-13);ctx.lineTo(-5,-13);ctx.closePath();ctx.fill();
      ctx.strokeStyle=hero.color;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-15,-5);ctx.lineTo(-5,-11);ctx.moveTo(15,-5);ctx.lineTo(5,-11);ctx.stroke();
      drawHead(0,-20,7,hero);
      ctx.restore();
      if(!sf.inBarrel){
        const hint=sf.outTimer>1.8?'WIPEOUT RISK!':'FIND THE BARREL';
        const hcol=sf.outTimer>1.8?'#ff3300':'#ffaa00';
        T(hint,surX,surY-42,hcol,7);
      }
      if(sf.surferY<H*0.44&&sf.inBarrel)T('SPACE → aerial',surX,surY-56,'rgba(255,255,100,0.5)',6);
    }
  } else {
    ctx.fillStyle='#fff';
    for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2+sf.wt*4;const r=10+Math.random()*22;ctx.beginPath();ctx.arc(sf.wipeX+Math.cos(a)*r,sf.wipeY+Math.sin(a)*r,2+Math.random()*3,0,Math.PI*2);ctx.fill();}
    T('WIPEOUT!',W/2,H/2-14,'#ff2200',16);T('Paddling back...',W/2,H/2+10,'#fff',8);
  }

  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,34);
  T('SCORE: '+Math.floor(sf.score),14,22,player.color,9,'left');
  T('COMBO \xD7'+sf.combo,W/2,22,'#ffff00',9);
  T('TIME: '+sf.timer,W-14,22,sf.timer<=10?'#ff3300':'#fff',9,'right');
  if(sf.trickTimer>0){ctx.globalAlpha=Math.min(1,sf.trickTimer);T(sf.trickText+'!',W/2,H/2-28,'#ffff00',14);ctx.globalAlpha=1;}
  if(sf.bonusTxtT>0){ctx.globalAlpha=Math.min(1,sf.bonusTxtT);T(sf.bonusTxt,W/2,H/2+8,'#ff8800',12);ctx.globalAlpha=1;}
  T('↑↓ position · ←→ speed · SPACE near lip = aerial (←→ spin)',W/2,H-5,'rgba(255,255,255,0.28)',6);
  if(sf.phase==='end')drawEnd("SURF'S UP!",Math.floor(sf.score),'COMBOS: '+sf.combo,'#44aaff',HS.surfing);
}

// ══════════════════════════════════════════════════════════════════════════════
// BMX  — variable jump (hold SPACE to charge)
// ══════════════════════════════════════════════════════════════════════════════
let bm={};
function initBMX(){
  const TL=25000;
  const ramps=[];
  let rx=320;
  while(rx<TL-600){
    const rnd=Math.random();
    let h,w,type;
    if(rnd<0.35){h=22+Math.random()*22;w=55+Math.random()*20;type='small';}
    else if(rnd<0.72){h=52+Math.random()*38;w=82+Math.random()*28;type='med';}
    else{h=92+Math.random()*52;w=110+Math.random()*42;type='big';}
    ramps.push({x:rx,h,w,type});
    rx+=300+Math.random()*260+(type==='big'?220:type==='med'?80:0);
  }
  const trees=Array.from({length:Math.floor(TL/90)},(_,i)=>({
    x:i*90+Math.random()*55,h:30+Math.random()*50,
    kind:Math.random()>.55?'palm':'pine'}));
  bm={bx:100,by:H-72,vx:4,vy:0,
    score:0,phase:'play',elapsed:0,
    onGround:true,inAir:false,airTime:0,
    trickText:'',trickTimer:0,combo:0,totalTricks:0,
    camX:0,ramps,trackLen:TL,trees,
    crashed:false,crashTimer:0,
    jumpCharge:0,jumped:false,
    doneTricks:new Set(),wheelRot:0,
    // flip state
    rotation:0,rotVel:0,
    airRot:0,flipDir:0,flipsScored:0,
    flipText:'',flipTimer:0,
    clouds:Array.from({length:9},(_,i)=>({x:i*210+Math.random()*100,y:38+Math.random()*52})),
  };
}
const BMX_TRICKS={
  'KeyA':{name:'NO HANDER',pts:200},
  'KeyS':{name:'TAILWHIP', pts:300},
  'KeyD':{name:'360\xB0',   pts:350},
  'KeyW':{name:'SUPERMAN',  pts:400},
};
function bmxGround(x){
  const gy=H-62;
  for(const r of bm.ramps){
    if(x>r.x-r.w/2&&x<r.x+r.w/2){
      const t=(x-(r.x-r.w/2))/r.w;
      return gy-r.h*(1-Math.abs(t*2-1));
    }
  }
  return gy;
}
function updateBMX(dt){
  if(bm.phase==='end'){if(kp['Enter'])state='menu';return;}
  if(bm.crashed){bm.crashTimer-=dt;
    if(bm.crashTimer<=0){
      bm.crashed=false;bm.by=H-72;bm.vy=0;bm.onGround=true;bm.combo=0;
      bm.rotation=0;bm.rotVel=0;bm.airRot=0;bm.flipsScored=0;bm.flipDir=0;}
    return;}

  bm.elapsed+=dt;
  bm.vx=Math.min(7, 4+bm.totalTricks*.14);
  if(keys['ArrowRight'])bm.vx=Math.min(8,bm.vx+.7);
  bm.bx+=bm.vx;bm.camX=bm.bx-160;bm.wheelRot+=bm.vx*.13;

  // SPACE: base jump reduced 30%; full power only by timing the ramp peak (t=0.5)
  if(kp['Space']&&bm.onGround&&!bm.jumped){
    let jp=9.8; // base (70% of original 14)
    for(const r of bm.ramps){
      if(bm.bx>r.x-r.w/2&&bm.bx<r.x+r.w/2){
        const t=(bm.bx-(r.x-r.w/2))/r.w;
        const prox=1-Math.abs(t*2-1); // 0 at edges, 1.0 at perfect peak
        jp=9.8+prox*4.2;             // 9.8 → 14.0
        break;
      }
    }
    bm.vy=-jp;
    bm.jumped=true;bm.inAir=true;
    bm.airRot=0;bm.flipsScored=0;bm.rotation=0;bm.rotVel=0;bm.flipDir=0;
    sfx.jump();
  }

  bm.vy+=0.38;bm.by+=bm.vy;

  // Ramp slope: give an upward kick when riding over the rising half of a ramp
  if(bm.onGround){
    const gyAhead=bmxGround(bm.bx+bm.vx*3);
    const gyCur  =bmxGround(bm.bx);
    const slopeRise=gyCur-gyAhead; // positive = ground rising ahead
    if(slopeRise>4&&!bm.jumped){
      // Natural ramp launch — rider leaves the ramp at the peak
      const boost=Math.min(slopeRise*0.55,9);
      bm.vy=-boost;
      bm.jumped=true;bm.inAir=true;
      bm.airRot=0;bm.flipsScored=0;bm.rotation=0;bm.rotVel=0;bm.flipDir=0;
      bm.flipText='LAUNCH!';bm.flipTimer=0.9;
      sfx.jump();
    }
  }

  // FLIP: arrow keys only while airborne
  if(bm.inAir){
    if(keys['ArrowUp']){
      bm.rotVel=Math.min(0.195,bm.rotVel+0.010);
      if(bm.flipDir===0)bm.flipDir=1;
    }
    if(keys['ArrowDown']){
      bm.rotVel=Math.max(-0.195,bm.rotVel-0.010);
      if(bm.flipDir===0)bm.flipDir=-1;
    }
    bm.rotVel*=0.97;
    bm.rotation+=bm.rotVel;
    bm.airRot+=Math.abs(bm.rotVel);
    const done=Math.floor(bm.airRot/(Math.PI*2));
    if(done>bm.flipsScored){
      bm.flipsScored=done;
      const pts=450*done*(bm.combo+1)*player.bonus('bmx')|0;
      bm.score+=pts;bm.combo++;bm.totalTricks++;
      const nm=bm.flipDir>=0?'BACKFLIP':'FRONTFLIP';
      bm.flipText=done>1?done+'× '+nm+'!':nm+'!';
      bm.flipTimer=1.8;sfx.score();
    }
  }else{
    bm.rotation*=0.75;
    bm.rotVel*=0.5;
  }
  if(bm.flipTimer>0)bm.flipTimer-=dt;

  // Ground
  const gy=bmxGround(bm.bx);
  if(bm.by>=gy-18){
    if(bm.inAir){
      // Landing check — crash if mid-flip
      const snap=((bm.rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const off=Math.min(snap,Math.PI*2-snap);
      if(bm.airRot>Math.PI*.7&&off>1.1){
        bm.crashed=true;bm.crashTimer=1.2;bm.inAir=false;
        bm.score=Math.max(0,bm.score-200);sfx.oof();return;
      }
      if(bm.airTime>.3&&(bm.doneTricks.size>0||bm.flipsScored>0))sfx.score();
      bm.inAir=false;bm.airTime=0;bm.doneTricks.clear();bm.jumped=false;
      bm.airRot=0;bm.flipsScored=0;bm.rotation=0;bm.rotVel=0;bm.flipDir=0;
    }
    bm.by=gy-18;bm.vy=0;bm.onGround=true;
  }else{
    bm.onGround=false;bm.inAir=true;bm.airTime+=dt;bm.score+=dt*4;
  }

  // A/S/D/W tricks
  if(bm.trickTimer>0)bm.trickTimer-=dt;
  if(bm.inAir&&bm.trickTimer<=0){
    for(const [k,t] of Object.entries(BMX_TRICKS)){
      if(kp[k]&&!bm.doneTricks.has(t.name)){
        bm.doneTricks.add(t.name);bm.trickText=t.name;bm.trickTimer=.55;
        const pts=t.pts*(bm.combo+1)*player.bonus('bmx')|0;
        bm.score+=pts;bm.totalTricks++;bm.combo++;sfx.kick();break;
      }
    }
  }
  if(bm.bx>bm.trackLen){bm.phase='end';saveHS('bmx',Math.floor(bm.score));sfx.score();}
}
function drawBMX(){
  const prog=Math.min(1,bm.bx/bm.trackLen);
  // Sky shifts dawn→dusk over the course
  const sky=ctx.createLinearGradient(0,0,0,H);
  if(prog<0.5){
    sky.addColorStop(0,'#8ad4f0');sky.addColorStop(.65,'#ffe080');sky.addColorStop(1,'#ff9933');
  }else{
    sky.addColorStop(0,'#1a2a5e');sky.addColorStop(.55,'#cc4400');sky.addColorStop(1,'#ff6600');
  }
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  bm.clouds.forEach(c=>{
    const cx=((c.x-bm.camX*.16)+W*5)%(W+280)-140;
    ctx.fillStyle='rgba(255,255,255,0.82)';
    [0,24,48].forEach((d,i)=>{ctx.beginPath();ctx.arc(cx+d,c.y,27-i*4,0,Math.PI*2);ctx.fill();});
  });

  bm.trees.forEach(t=>{
    const tx=t.x-bm.camX*.68;
    if(tx<-30||tx>W+30)return;
    ctx.fillStyle='#6a3510';ctx.fillRect(tx-4,H-62-t.h,8,t.h);
    if(t.kind==='palm'){
      ctx.fillStyle='#2d7a1a';
      [[tx,H-62-t.h,18],[tx-13,H-62-t.h-4,12],[tx+13,H-62-t.h-4,12]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();});
    }else{
      ctx.fillStyle='#1e6016';
      ctx.beginPath();ctx.moveTo(tx,H-62-t.h-26);ctx.lineTo(tx-15,H-62-t.h+8);ctx.lineTo(tx+15,H-62-t.h+8);ctx.closePath();ctx.fill();
    }
  });

  ctx.fillStyle='#7d6340';ctx.fillRect(0,H-62,W,62);
  ctx.fillStyle='#5e4a2a';ctx.fillRect(0,H-62,W,5);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;ctx.setLineDash([22,22]);
  ctx.beginPath();ctx.moveTo(0,H-30);ctx.lineTo(W,H-30);ctx.stroke();ctx.setLineDash([]);

  bm.ramps.forEach(r=>{
    const rx=r.x-bm.camX;
    if(rx<-150||rx>W+150)return;
    const ahead=rx-(bm.bx-bm.camX);
    if(r.type==='big'&&ahead>0&&ahead<260&&bm.onGround){
      ctx.strokeStyle='rgba(255,220,0,0.55)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(bm.bx-bm.camX,H-62);ctx.lineTo(rx,H-62-r.h);ctx.stroke();ctx.setLineDash([]);
      T('BIG AIR!',rx,H-62-r.h-16,'#ffff00',7);
    }
    const rc=r.type==='big'?'#ff8800':r.type==='med'?'#bb7733':'#997755';
    ctx.fillStyle=rc;
    ctx.beginPath();ctx.moveTo(rx-r.w/2,H-62);ctx.lineTo(rx,H-62-r.h);ctx.lineTo(rx+r.w/2,H-62);ctx.closePath();ctx.fill();
    ctx.strokeStyle=r.type==='big'?'#ff4400':'#7a5522';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rx-r.w/2,H-62);ctx.lineTo(rx,H-62-r.h);ctx.lineTo(rx+r.w/2,H-62);ctx.stroke();
    if(r.type==='big')T('▲',rx,H-62-r.h-4,'#ff8800',8);
  });

  const finX=bm.trackLen-bm.camX;
  if(finX>-30&&finX<W+60){
    for(let y=H-140;y<H-62;y+=10)for(let i=0;i<2;i++){
      ctx.fillStyle=(Math.floor(y/10)+i)%2===0?'#000':'#fff';ctx.fillRect(finX-10+i*10,y,10,10);}
    T('FINISH!',finX,H-148,'#000',10);
  }

  const bx2=bm.bx-bm.camX,by2=bm.by;
  if(bm.crashed){
    T('CRASH!',bx2,by2-42,'#ff2200',16);
    T('BAD LANDING!',bx2,by2-18,'#ffaa00',8);
  }else{
    const bkCol=EQUIP.bmx[player.equip.bmx].col;
    ctx.save();ctx.translate(bx2,by2);ctx.rotate(bm.rotation);
    ctx.strokeStyle='#333';ctx.lineWidth=4;
    [-17,17].forEach(wx=>{
      ctx.beginPath();ctx.arc(wx,14,12,0,Math.PI*2);ctx.stroke();
      for(let s=0;s<4;s++){const a=s*Math.PI/2+bm.wheelRot;ctx.beginPath();ctx.moveTo(wx,14);ctx.lineTo(wx+Math.cos(a)*10,14+Math.sin(a)*10);ctx.stroke();}
    });
    ctx.strokeStyle=bkCol;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-17,14);ctx.lineTo(0,-5);ctx.lineTo(17,14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(18,-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(18,-18);ctx.lineTo(18,-2);ctx.stroke();
    ctx.fillStyle='#333';ctx.fillRect(-7,-10,14,4);
    ctx.strokeStyle=player.color;ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,-5);ctx.lineTo(-7,7);ctx.lineTo(-17,14);
    ctx.moveTo(0,-5);ctx.lineTo(7,5);ctx.lineTo(17,14);
    ctx.moveTo(0,-5);ctx.lineTo(4,-18);ctx.moveTo(4,-14);ctx.lineTo(18,-10);ctx.stroke();
    drawHead(4,-26,8,player.hero);
    ctx.restore();

    // Charge bar
    if(bm.jumpCharge>0&&bm.onGround){
      ctx.fillStyle='#111';ctx.fillRect(bx2-32,by2-52,64,10);
      ctx.fillStyle=bm.jumpCharge>.7?'#ff4400':'#00ff88';
      ctx.fillRect(bx2-32,by2-52,64*bm.jumpCharge,10);
      ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.strokeRect(bx2-32,by2-52,64,10);
      T('CHARGE',bx2,by2-54,'#fff',5);
    }

    // Flip progress arc
    if(bm.inAir&&bm.airRot>0.2){
      const pct=(bm.airRot/(Math.PI*2))%1;
      ctx.strokeStyle='rgba(255,255,0,0.75)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(bx2,by2-50,16,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(bx2,by2-50,16,0,Math.PI*2);ctx.stroke();
      // Show flip count inside arc
      if(bm.flipsScored>0){ctx.font='8px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#ffff00';ctx.fillText(bm.flipsScored,bx2,by2-46);}
    }
  }

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,38);
  T('SCORE: '+Math.floor(bm.score),14,26,player.color,9,'left');
  const mm=Math.floor(bm.elapsed/60)|0, ss=Math.floor(bm.elapsed%60)|0;
  T((mm?mm+'m ':'')+ss+'s',W/2,26,'#ffff00',9);
  ctx.fillStyle='#333';ctx.fillRect(W-128,10,108,18);
  ctx.fillStyle='#00dd44';ctx.fillRect(W-128,10,108*prog,18);
  ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.strokeRect(W-128,10,108,18);
  T(Math.floor(prog*100)+'%',W-74,24,'#fff',7);

  if(bm.flipTimer>0){
    ctx.globalAlpha=Math.min(1,bm.flipTimer*.8);
    T(bm.flipText,W/2,H/2-36,'#ffff00',14);ctx.globalAlpha=1;
  }else if(bm.trickTimer>0){
    T(bm.trickText+'!',W/2,H/2-28,'#ff00ff',12);
  }

  if(bm.inAir){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-178,H-44,356,22);
    T('↑ BACKFLIP   ↓ FRONTFLIP   A/S/D/W TRICKS',W/2,H-28,'#ffff00',7);
  }else{
    T('HOLD SPACE = CHARGE JUMP   RELEASE = LAUNCH',W/2,H-6,'rgba(255,255,255,0.28)',7);
  }

  if(bm.phase==='end')drawEnd('FINISH LINE!',Math.floor(bm.score),'TIME: '+(mm?mm+'m ':'')+ss+'s  TRICKS: '+bm.totalTricks,'#ff44aa',HS.bmx);
}

// FRISBEE
// ══════════════════════════════════════════════════════════════════════════════
let fr={};
function initFrisbee(){
  fr={phase:'aim',tx:75,ty:H-72,dx:75,dy:H-72,dvx:0,dvy:0,
    angle:-40,power:50,powerDir:1,spin:0,
    windX:(Math.random()-.5)*2.4,windY:(Math.random()-.5)*.5,
    totalScore:0,lastPts:0,lastText:'',
    throws:0,maxThrows:5,trickTimer:0,resultTimer:0,
    trail:[],bgO:0,throwAnim:0,
    targets:[
      {x:420,r:72,pts:50, col:'#4488ff'},
      {x:420,r:44,pts:200,col:'#ffaa00'},
      {x:420,r:20,pts:500,col:'#ff3300'},
    ],
  };
}
function updateFrisbee(dt){
  fr.bgO+=.4;
  if(fr.trickTimer>0)fr.trickTimer-=dt;
  if(fr.phase==='end'){if(kp['Enter'])state='menu';return;}
  if(fr.phase==='aim'){
    fr.power+=fr.powerDir*dt*72;
    if(fr.power>=100){fr.power=100;fr.powerDir=-1;}
    if(fr.power<=0){fr.power=0;fr.powerDir=1;}
    if(keys['ArrowUp'])   fr.angle=Math.max(-82,fr.angle-55*dt);
    if(keys['ArrowDown']) fr.angle=Math.min(-6, fr.angle+55*dt);
    if(kp['Space']||kp['Enter']){
      const rad=fr.angle*Math.PI/180,spd=fr.power*.11+4;
      fr.dvx=Math.cos(rad)*spd;fr.dvy=Math.sin(rad)*spd;
      fr.dx=fr.tx+22;fr.dy=fr.ty-28;fr.spin=fr.dvx*.4;
      fr.trail=[];fr.throws++;fr.throwAnim=.35;fr.phase='fly';sfx.jump();
    }return;
  }
  if(fr.phase==='fly'){
    fr.dvx+=fr.windX*dt*.4;fr.dvy+=.13;fr.dvy+=fr.windY*dt;
    fr.dvx*=.999;fr.dx+=fr.dvx;fr.dy+=fr.dvy;fr.spin+=fr.dvx*.08;
    fr.trail.push({x:fr.dx,y:fr.dy});if(fr.trail.length>25)fr.trail.shift();
    if(fr.dy>=H-72||fr.dx>W+60||fr.dx<-60){
      fr.lastPts=0;fr.lastText='OUT OF BOUNDS';
      if(fr.dx>0&&fr.dx<W){
        fr.lastPts=10;fr.lastText='IN BOUNDS! +10';
        for(const t of fr.targets){
          const d=Math.sqrt((fr.dx-t.x)**2+(fr.dy-(H-72))**2);
          if(d<t.r){fr.lastPts=t.pts;fr.lastText=t.pts+' POINTS!';}
        }
      }
      fr.totalScore+=fr.lastPts;fr.trickTimer=2;fr.phase='result';fr.resultTimer=2.2;
      fr.lastPts>100?sfx.score():sfx.kick();
    }return;
  }
  if(fr.phase==='result'){fr.resultTimer-=dt;
    if(fr.resultTimer<=0){
      if(fr.throws>=fr.maxThrows){fr.phase='end';saveHS('frisbee',fr.totalScore);}
      else{fr.phase='aim';fr.dx=fr.tx;fr.dy=fr.ty;fr.power=50;
        fr.windX=(Math.random()-.5)*2.4;fr.windY=(Math.random()-.5)*.5;fr.trail=[];}
    }
  }
}
function drawFrisbee(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#7dd6f0');sky.addColorStop(.7,'#a8eaff');sky.addColorStop(1,'#ffe89a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.82)';
  [[0,55,26],[180,42,20],[350,66,30],[510,50,23]].forEach(([ox,y,r])=>{
    const cx=((fr.bgO*.18+ox)%(W+120))-60;
    [0,20,40].forEach((d,i)=>{ctx.beginPath();ctx.arc(cx+d,y,r-i*5,0,Math.PI*2);ctx.fill();});
  });
  ctx.fillStyle='#5cc45c';
  ctx.beginPath();ctx.moveTo(0,H-72);
  for(let x=0;x<=W;x+=5)ctx.lineTo(x,H-72-Math.sin((x+fr.bgO*.08)*.018)*36);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7ada7a';ctx.fillRect(0,H-72,W,72);
  ctx.fillStyle='#50b050';ctx.fillRect(0,H-72,W,5);

  [...fr.targets].reverse().forEach(t=>{
    ctx.globalAlpha=.4;ctx.fillStyle=t.col;
